{{- if .Values.components.artifactory.enabled }}
{{- $af := .Values.components.artifactory }}
# -----------------------------------------------------------------------------
# Artifactory OSS in two Applications:
#
#   artifactory        (wave 6)  the OpenShift extras -- custom SCC, Route,
#                                first-boot repo-bootstrap ConfigMap, and the
#                                three Secrets the JFrog chart needs, all
#                                materialized from Vault by ESO
#   artifactory-chart  (wave 7)  the JFrog Helm chart itself, sourced from
#                                charts.jfrog.io
#
# The extras MUST be Healthy first: the SCC admission and the Secrets exist
# before the StatefulSet pods are admitted. The admin password, master/join
# keys and the bundled PostgreSQL password are generated by vault-secrets
# and pulled from Vault -- nothing is hand-created.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "artifactory" "namespace" .Values.argocd.namespace "syncWave" $af.extrasSyncWave "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.componentsPath }}/artifactory
    helm:
      valuesObject:
        vault:
          kvMount: {{ .Values.vault.kvMount | quote }}
          pathPrefix: {{ .Values.vault.pathPrefix | quote }}
          secretStoreName: {{ .Values.vault.secretStoreName | quote }}
        pipelineNamespace: {{ .Values.pipelineNamespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: artifactory
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "artifactory-chart" "namespace" .Values.argocd.namespace "syncWave" $af.chartSyncWave "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: https://charts.jfrog.io
    chart: artifactory-oss
    targetRevision: {{ $af.chartVersion | quote }}
    helm:
      releaseName: artifactory
      # NOTE the umbrella nesting: everything sits under a top-level `artifactory:`.
      valuesObject:
        # `global` is Helm-special and must sit OUTSIDE the `artifactory:` key.
        # adaptSecurityContext MUST be disabled: the custom SCC's fsGroup is
        # RunAsAny, so bitnami's OpenShift auto-detect would strip fsGroup and
        # the bundled postgres would crashloop on a root-owned volume. See
        # components/artifactory/README.md.
        global:
          compatibility:
            openshift:
              adaptSecurityContext: disabled
        artifactory:
          nginx:
            enabled: false
          postgresql:
            enabled: true
            auth:
              username: artifactory
              database: artifactory
              existingSecret: artifactory-postgresql
          serviceAccount:
            create: true
            name: artifactory
          artifactory:
            masterKeySecretName: artifactory-keys
            joinKeySecretName: artifactory-keys
            admin:
              secret: artifactory-admin
              dataKey: password
            configMapName: artifactory-repo-bootstrap
            copyOnEveryStartup:
              - source: /artifactory_bootstrap/artifactory.repository.config.import.json
                target: etc/artifactory/
            persistence:
              enabled: true
              size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: artifactory
  # Cosmetic-but-permanent OutOfSync sources on the StatefulSet (render-time
  # checksum annotation + server-defaulted fields). Ignoring them keeps the
  # app Synced without suppressing real drift. See components/artifactory/README.md.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: artifactory
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1artifactory-unified-secret
        - /spec/volumeClaimTemplates
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
        - /spec/persistentVolumeClaimRetentionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
