{{- if .Values.components.externalSecrets.enabled }}
{{- $es := .Values.components.externalSecrets }}
# -----------------------------------------------------------------------------
# External Secrets Operator + the Vault ClusterSecretStore. Wave 0: every
# credential-consuming component (waves 5+) renders ExternalSecrets that
# reference the store this component creates.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "external-secrets" "namespace" .Values.argocd.namespace "syncWave" $es.syncWave "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.componentsPath }}/external-secrets
    helm:
      valuesObject:
        namespace: {{ $es.namespace | quote }}
        controllerNamespace: {{ $es.controllerNamespace | quote }}
        operator:
          name: {{ $es.operatorName | quote }}
          channel: {{ $es.channel | quote }}
          source: {{ $es.source | quote }}
        vault:
          server: {{ include "bootstrap.vaultAddress" . | quote }}
          namespace: {{ .Values.vault.namespace | quote }}
          tokenSecretName: {{ .Values.vault.tokenSecretName | quote }}
          tokenSecretKey: {{ .Values.vault.tokenSecretKey | quote }}
          kvMount: {{ .Values.vault.kvMount | quote }}
          secretStoreName: {{ .Values.vault.secretStoreName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $es.namespace }}
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
