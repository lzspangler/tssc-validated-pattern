{{- if .Values.components.gitlab.enabled }}
{{- $g := .Values.components.gitlab }}
# -----------------------------------------------------------------------------
# GitLab, plus the seeding job that:
#   * imports the application and gitops repositories from GitHub
#   * mints the two project access tokens the pipelines push with
#     (scm-auth-secret, scm-auth-gitops-secret)
#   * mints the PaC token (gitlab-pac-token) Pipelines-as-Code uses both to
#     watch the application repo and to create its webhooks
#   * commits the .tekton/ PaC PipelineRuns into the application repo
#   * creates the PaC Repository CR in the pipeline namespace
#
# The root password is NOT a value: the deployment sources it from the
# tssc-gitlab-root-password Secret, which ESO materializes from Vault.
#
# There is no EventListener webhook any more -- PaC owns the webhooks.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "gitlab" "namespace" .Values.argocd.namespace "syncWave" $g.syncWave "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.componentsPath }}/gitlab
    helm:
      valuesObject:
        cluster:
          subdomain: {{ .Values.deployer.domain | quote }}
        gitlab:
          rootPasswordSecret: tssc-gitlab-root-password
        pipeline:
          namespace: {{ .Values.pipelineNamespace | quote }}
        pac:
          enabled: true
        vault:
          kvMount: {{ .Values.vault.kvMount | quote }}
          pathPrefix: {{ .Values.vault.pathPrefix | quote }}
          secretStoreName: {{ .Values.vault.secretStoreName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $g.namespace }}
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
