{{- if .Values.components.keycloakClients.enabled }}
{{- $kc := .Values.components.keycloakClients }}
# -----------------------------------------------------------------------------
# Bring-your-own-Keycloak. The target cluster SHIPS a Keycloak (it is not
# installed by this chart) -- this component provisions only what the demo
# needs into keycloak.realm: the tpa document scopes, the tpa-* roles, and
# the tpa-cli / tpa-frontend / trusted-artifact-signer clients. It does not
# touch existing clients, users or identity-provider config.
#
# The tpa-cli client secret is generated by the vault-secrets component and
# materialized in the Keycloak namespace by ESO; the provisioning Job reads
# it from there, so no credential transits this chart.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "keycloak-clients" "namespace" .Values.argocd.namespace "syncWave" $kc.syncWave "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.componentsPath }}/keycloak-clients
    helm:
      valuesObject:
        namespace: {{ .Values.keycloak.namespace | quote }}
        {{- if $kc.keycloakUrl }}
        keycloakUrl: {{ $kc.keycloakUrl | quote }}
        {{- else if .Values.keycloak.issuerUrl }}
        # Derive the console URL from the issuer the deployer gave us.
        keycloakUrl: {{ regexReplaceAll "/realms/.*" .Values.keycloak.issuerUrl "" | quote }}
        {{- else }}
        keycloakUrl: {{ printf "https://sso.%s" .Values.deployer.domain | quote }}
        {{- end }}
        realm: {{ .Values.keycloak.realm | quote }}
        tlsVerify: {{ $kc.tlsVerify }}
        adminSecret:
          name: {{ .Values.keycloak.adminSecretName | quote }}
        vault:
          kvMount: {{ .Values.vault.kvMount | quote }}
          pathPrefix: {{ .Values.vault.pathPrefix | quote }}
          secretStoreName: {{ .Values.vault.secretStoreName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.keycloak.namespace }}
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
