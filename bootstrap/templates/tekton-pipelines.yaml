{{- if .Values.components.tekton.enabled }}
{{- $tk := .Values.components.tekton }}
{{- $ns := .Values.pipelineNamespace }}
{{- $clusterDefaults := and .Values.components.pipelines.enabled .Values.components.tekton.enabled .Values.components.pipelines.clusterDefaults | default false }}
# -----------------------------------------------------------------------------
# The Pipeline definitions, synced as PLAIN YAML from pipelines/pipelines.
# They are NOT triggered by webhooks: the .tekton/ PipelineRuns the GitLab
# seeding job commits into the application repo reference these Pipelines by
# pipelineRef, and Pipelines-as-Code starts them on push / merge-request
# events / matching MR comments.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "tekton-pipelines" "namespace" .Values.argocd.namespace "syncWave" $tk.syncWaves.pipelines "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.tektonPath }}/pipelines
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  {{- if $clusterDefaults }}
  # The tekton-cluster-defaults Job rewrites these param defaults from
  # deployer.domain after every sync; ignoring exactly those fields keeps
  # selfHeal from reverting the patch. Repo-side edits to them no longer
  # reach a gitops-installed cluster -- change deployer.domain instead.
  ignoreDifferences:
    - group: tekton.dev
      kind: Pipeline
      jqPathExpressions:
        - '.spec.params[] | select(.name == "gitops-url" or .name == "git-host") | .default'
  {{- end }}
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
