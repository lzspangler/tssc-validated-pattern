{{- if .Values.components.vaultSecrets.enabled }}
{{- $vs := .Values.components.vaultSecrets }}
# -----------------------------------------------------------------------------
# Credential generation. A re-runnable Job that connects to the cluster's
# EXISTING Vault with the platform token Secret and, for every credential the
# demo needs, either leaves the existing value alone or generates one
# (openssl-grade random) and stores it at <kvMount>/<pathPrefix>/<name>.
#
# Nothing in this chart carries a credential value: the only externally
# supplied secret is the AI API key, which the deployer injects via
# ai.apiKey (RHDP order form) and which this component stores into Vault like
# every generated credential. If ai.apiKey is empty, the Vault entry is left
# untouched -- a pre-loaded key works identically.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "vault-secrets" "namespace" .Values.argocd.namespace "syncWave" $vs.syncWave "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.componentsPath }}/vault-secrets
    helm:
      valuesObject:
        vault:
          address: {{ include "bootstrap.vaultAddress" . | quote }}
          namespace: {{ .Values.vault.namespace | quote }}
          tokenSecretName: {{ .Values.vault.tokenSecretName | quote }}
          tokenSecretKey: {{ .Values.vault.tokenSecretKey | quote }}
          kvMount: {{ .Values.vault.kvMount | quote }}
          pathPrefix: {{ .Values.vault.pathPrefix | quote }}
        ai:
          {{- $key := include "bootstrap.aiApiKey" . }}
          {{- if $key }}
          apiKey: {{ $key | quote }}
          {{- else }}
          apiKey: ""
          {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.vault.namespace }}
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
