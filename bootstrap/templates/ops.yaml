{{- if .Values.components.ops.enabled }}
{{- $ops := .Values.components.ops }}
# -----------------------------------------------------------------------------
# Operational jobs: Lightwell data loading into RHTPA, agent image
# pre-warming, and ad-hoc upload tooling. Runs AFTER rhtpa-operator (15)
# so RHTPA is serving before the data-loading Job starts.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "ops" "namespace" .Values.argocd.namespace "syncWave" $ops.syncWave "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.componentsPath }}/ops
    helm:
      valuesObject:
        pipelineNamespace: {{ .Values.pipelineNamespace | quote }}
        agentImage: {{ .Values.components.ops.agentImage | default "quay.io/sscdemo/ai-agent-maven-aider:v1.0.1" | quote }}
        tpa:
          url: {{ printf "https://server-trusted-profile-analyzer.%s" .Values.deployer.domain | quote }}
        oidc:
          issuerUrl: {{ include "bootstrap.issuer" . | quote }}
        tls:
          caConfigMap: {{ .Values.components.rhtpaPrerequisites.caConfigMap | quote }}
        vault:
          kvMount: {{ .Values.vault.kvMount | quote }}
          pathPrefix: {{ .Values.vault.pathPrefix | quote }}
          secretStoreName: {{ .Values.vault.secretStoreName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.pipelineNamespace }}
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
