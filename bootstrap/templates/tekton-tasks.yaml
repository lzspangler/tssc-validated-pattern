{{- if .Values.components.tekton.enabled }}
{{- $tk := .Values.components.tekton }}
{{- $ns := .Values.pipelineNamespace }}
# -----------------------------------------------------------------------------
# The Tekton Tasks, synced as PLAIN YAML from pipelines/tasks at the repo
# root. No Helm, no templating -- editing a Task there changes what the
# cluster runs on the next reconcile.
# -----------------------------------------------------------------------------
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" "tekton-tasks" "namespace" .Values.argocd.namespace "syncWave" $tk.syncWaves.tasks "root" .) }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.tektonPath }}/tasks
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- if ne $ns "tssc-app-ci" }}
{{- fail (printf "pipelineNamespace is %q, but Task RBAC manifests under pipelines/tasks/ hardcode tssc-app-ci. Edit those files to match before changing pipelineNamespace." $ns) }}
{{- end }}
{{- end }}
