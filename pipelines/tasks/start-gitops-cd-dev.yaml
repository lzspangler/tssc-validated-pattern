apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: start-gitops-cd-dev
  labels:
    app.kubernetes.io/part-of: maven-build-ci
  annotations:
    tekton.dev/pipelines.minVersion: "0.41.0"
    tekton.dev/tags: "tekton, pipelinerun"
spec:
  description: >-
    Start a gitops-cd-dev PipelineRun through the Kubernetes API. Tekton has no
    built-in "run this pipeline when that one finishes", so ci-build-publish
    runs this as a finally task and creates the CD run directly: one POST of a
    PipelineRun manifest, authenticated with the pod's own service account
    token. (kubectl/tkn do NOT pick up in-cluster credentials on their own, but
    the API is one curl away: token and CA cert are projected into every pod.)
  params:
    - name: NAMESPACE
      type: string
      description: Namespace the CD PipelineRun is created in.
      default: tssc-app-ci
    - name: PIPELINE
      type: string
      description: CD pipeline to start.
      default: gitops-cd-dev
    - name: IMAGE
      type: string
      description: Full image reference published by CI; forwarded to the CD pipeline.
    - name: APP_REPO_URL
      type: string
      description: Application repo the image was built from; forwarded for MR context.
      default: ""
    - name: APP_COMMIT
      type: string
      description: Application commit the image was built from; forwarded for MR context.
      default: ""
    # ---------------- per-application promotion routing ----------------
    # WITHOUT these, the created run falls back to gitops-cd-dev's DEFAULTS,
    # which serve the spring-boot example: every application's CI then
    # promotes into the FIRST application's gitops repo (on cluster-dl265 a
    # lightwell build wrote its tag into spring-boot's dev values, and two
    # lightwell CI runs even published under the spring-boot image name from
    # a stale .tekton definition). The pipeline (ci-build-publish) passes
    # these through from its own params, which the per-repo .tekton/
    # definitions set per application.
    - name: GITOPS_URL
      type: string
      description: GitLab URL of the gitops repository to promote into.
      default: https://gitlab-gitlab.apps.cluster-b7zgr.dyn.redhatworkshops.io/development/spring-boot-example-gitops
    - name: GIT_HOST
      type: string
      description: Host of the SCM serving the gitops repository.
      default: gitlab-gitlab.apps.cluster-b7zgr.dyn.redhatworkshops.io
    - name: VALUES_PATH
      type: string
      description: Values file inside the gitops repo whose image.tag is bumped.
      default: app/spring-boot-example/environments/dev/values.yaml
    - name: SCM_SECRET_NAME
      type: string
      description: Secret holding the gitops repository's own project access token.
      default: scm-auth-gitops-secret
    - name: GIT_IMAGE
      type: string
      description: >-
        Image this task runs in. It MUST contain curl AND jq (the payload is
        built with jq so the image reference is escaped safely). The pipeline
        overrides this with the agent image, which bundles both.
      default: quay.io/sscdemo/ai-agent-maven-aider:v1.0.1
  results:
    - name: PIPELINERUN
      description: Name of the created PipelineRun.
  steps:
    - name: create-pipelinerun
      image: $(params.GIT_IMAGE)
      env:
        - name: HOME
          value: /tekton/home
        - name: PARAM_NAMESPACE
          value: $(params.NAMESPACE)
        - name: PARAM_PIPELINE
          value: $(params.PIPELINE)
        - name: PARAM_IMAGE
          value: $(params.IMAGE)
        - name: PARAM_APP_REPO_URL
          value: $(params.APP_REPO_URL)
        - name: PARAM_APP_COMMIT
          value: $(params.APP_COMMIT)
        - name: PARAM_GITOPS_URL
          value: $(params.GITOPS_URL)
        - name: PARAM_GIT_HOST
          value: $(params.GIT_HOST)
        - name: PARAM_VALUES_PATH
          value: $(params.VALUES_PATH)
        - name: PARAM_SCM_SECRET_NAME
          value: $(params.SCM_SECRET_NAME)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # In-cluster API access: the service account token and CA are projected
        # into every pod; KUBERNETES_SERVICE_HOST/PORT are injected by kubelet.
        SA_DIR="/var/run/secrets/kubernetes.io/serviceaccount"
        TOKEN="$(cat "${SA_DIR}/token")"
        API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"

        # The manifest is assembled with jq --arg so every value is JSON-encoded
        # by jq itself; no hand-built string escaping of image references.
        PAYLOAD="$(jq -n \
          --arg pipeline "${PARAM_PIPELINE}" \
          --arg image "${PARAM_IMAGE}" \
          --arg repo "${PARAM_APP_REPO_URL}" \
          --arg commit "${PARAM_APP_COMMIT}" \
          --arg gitops_url "${PARAM_GITOPS_URL}" \
          --arg git_host "${PARAM_GIT_HOST}" \
          --arg values_path "${PARAM_VALUES_PATH}" \
          --arg scm_secret "${PARAM_SCM_SECRET_NAME}" \
          '{
            apiVersion: "tekton.dev/v1",
            kind: "PipelineRun",
            metadata: {
              generateName: ($pipeline + "-"),
              labels: {
                "app.kubernetes.io/part-of": "maven-build-ci",
                "tekton.dev/pipeline": $pipeline,
                trigger: "ci-build-publish"
              }
            },
            spec: {
              pipelineRef: { name: $pipeline },
              taskRunTemplate: { serviceAccountName: "pipeline" },
              timeouts: { pipeline: "15m0s" },
              params: [
                { name: "image",       value: $image },
                { name: "app-repo-url", value: $repo },
                { name: "app-commit",  value: $commit },
                { name: "gitops-url",  value: $gitops_url },
                { name: "git-host",    value: $git_host },
                { name: "values-path", value: $values_path },
                { name: "scm-secret-name", value: $scm_secret }
              ]
            }
          }')"

        HTTP_CODE="$(curl -sS --cacert "${SA_DIR}/ca.crt" \
          -o /tmp/pipelinerun-response.json -w '%{http_code}' \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -X POST "${API}/apis/tekton.dev/v1/namespaces/${PARAM_NAMESPACE}/pipelineruns" \
          -d "${PAYLOAD}")"

        # 201 Created is the only success; anything else (403 RBAC, 422 bad
        # manifest, ...) prints the API's own message so the CI log shows why.
        if [ "${HTTP_CODE}" != "201" ]; then
          echo "ERROR: creating the ${PARAM_PIPELINE} PipelineRun returned HTTP ${HTTP_CODE}:" >&2
          cat /tmp/pipelinerun-response.json >&2
          exit 1
        fi

        PR_NAME="$(jq -r '.metadata.name' /tmp/pipelinerun-response.json)"
        echo "Started PipelineRun ${PARAM_NAMESPACE}/${PR_NAME} (pipeline ${PARAM_PIPELINE})"
        printf '%s' "${PR_NAME}" > "$(results.PIPELINERUN.path)"
---
# The RBAC this task needs when it runs as a finally task of a PaC-started
# (or manually started) PipelineRun: it POSTs the gitops-cd-dev PipelineRun
# through the Kubernetes API as its pod's service account, which is the
# `pipeline` SA. The old triggers file carried this under a dedicated
# `tekton-triggers-sa`; with Pipelines as Code there is no such SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-pipelinerun-starter
  namespace: tssc-app-ci
  labels:
    app.kubernetes.io/part-of: tssc-validated-pattern
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    # "list" also covers wait-for-ci-build (demo-smoke), which polls
    # PipelineRuns as the same `pipeline` SA to chain onto CI's run.
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-pipelinerun-starter
  namespace: tssc-app-ci
  labels:
    app.kubernetes.io/part-of: tssc-validated-pattern
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-pipelinerun-starter
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: tssc-app-ci
