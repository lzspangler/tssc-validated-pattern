{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
# -----------------------------------------------------------------------------
# The two Secrets this chart used to render from Helm values, now
# materialized from Vault by External Secrets Operator. The NAMES and KEYS
# are unchanged, so the postgres Deployment and the RHTPA CR that reference
# them do not know the difference.
#
#   <name> (the postgres Secret)  database-user / database-name stay
#                                 chart values (not credentials);
#                                 database-password comes from Vault
#   oidc-tpa-cli                  client-secret comes from Vault and MUST
#                                 equal the value the keycloak-clients
#                                 component provisioned into the tpa-cli
#                                 client -- both read the same Vault entry,
#                                 so they cannot drift.
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tpa-prerequisites.name" . }}-pg
  labels:
    {{- include "tpa-prerequisites.labels" . | nindent 4 }}
  annotations:
    {{- include "tpa-prerequisites.argocd-syncwave" . | nindent 4 }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    # Same name the postgres Deployment's env secretKeyRefs point at.
    name: {{ include "tpa-prerequisites.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        database-user: {{ .Values.pgsql.user | quote }}
        database-name: {{ .Values.pgsql.database | quote }}
  data:
    - secretKey: database-password
      remoteRef:
        key: {{ printf "%s/tpa-db-password" $prefix | quote }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-tpa-cli
  labels:
    {{- include "tpa-prerequisites.labels" . | nindent 4 }}
  annotations:
    {{- include "tpa-prerequisites.argocd-syncwave" . | nindent 4 }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: oidc-tpa-cli
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ printf "%s/tpa-cli-client-secret" $prefix | quote }}
        property: client-secret
