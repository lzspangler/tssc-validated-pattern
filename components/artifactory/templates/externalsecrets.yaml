{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
{{- $ns := .Values.namespace }}
# -----------------------------------------------------------------------------
# The three Secrets the JFrog chart pins, materialized from Vault by ESO.
# The vault-secrets component generates every value; nothing is hand-created.
#
#   artifactory-admin      the `password` key MUST be bootstrap.creds format
#                          (admin@*=<PASSWORD>) because the chart mounts it
#                          verbatim as access/bootstrap.creds -- the ESO
#                          template composes the prefix around the Vault value
#   artifactory-keys       master-key (32 bytes hex) + join-key (16 bytes
#                          hex) -- mandatory for the JFbus/Frontend services
#   artifactory-postgresql postgres-password + password, pinned so a re-render
#                          never rotates them out from under the data dir
#
# Wave 1: they must exist before the JFrog Application (wave 7) admits pods.
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-admin
  namespace: {{ $ns }}
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: artifactory-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # bootstrap.creds format, composed around the Vault value. NOTE the
        # leading dot: {{ "{{" }} .password {{ "}}" }} is ESO's property reference -- without
        # it the engine reads a function call and fails with `function
        # "password" not defined`.
        password: 'admin@*={{ "{{" }} .password {{ "}}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/artifactory-admin-password" $prefix | quote }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-keys
  namespace: {{ $ns }}
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: artifactory-keys
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: master-key
      remoteRef:
        key: {{ printf "%s/artifactory-keys" $prefix | quote }}
        property: master-key
    - secretKey: join-key
      remoteRef:
        key: {{ printf "%s/artifactory-keys" $prefix | quote }}
        property: join-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-postgresql
  namespace: {{ $ns }}
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: artifactory-postgresql
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: postgres-password
      remoteRef:
        key: {{ printf "%s/artifactory-postgres" $prefix | quote }}
        property: postgres-password
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/artifactory-postgres" $prefix | quote }}
        property: password
