# Edge-terminated Route to the JFrog unified port (8082 serves the UI + the
# /artifactory REST API via the router). Service name/port verified against
# the rendered chart: Service `artifactory`, ClusterIP, ports 8082 + 8081.
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: artifactory
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  to:
    kind: Service
    name: artifactory
    weight: 100
  port:
    targetPort: 8082
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
