# -----------------------------------------------------------------------------
# OpenShift extras for the Artifactory OSS Application (rendered by
# bootstrap/templates/artifactory.yaml, which sources the JFrog chart from
# charts.jfrog.io -- a chart-repo source cannot carry our own manifests, so
# they live here).
#
# What this chart renders:
#   * the custom SCC (anyuid + RuntimeDefault seccomp) the JFrog pods need
#   * the edge Route on the unified port 8082
#   * the first-boot repository-bootstrap ConfigMap (the Lightwell
#     remote/virtual Maven repos -- on OSS every repo REST/UI endpoint is
#     Pro-gated, so the bootstrap importer is the only way)
#   * the three Secrets the JFrog chart pins (artifactory-admin,
#     artifactory-keys, artifactory-postgresql) -- materialized from Vault by
#     ESO, generated by the vault-secrets component. NOTHING is hand-created.
#   * a sync Job that builds the pipeline namespace's `maven-settings`
#     Secret (settings.xml mirroring every build through Artifactory) from
#     the same Vault-backed admin password
#
# The JFrog chart itself is NOT here -- see bootstrap/templates/artifactory.yaml
# for its valuesObject and the reasoning behind each.
# -----------------------------------------------------------------------------

# Namespace the extras and the JFegg chart land in.
namespace: artifactory

# Namespace the maven-settings Secret is written into (the Tekton layer).
pipelineNamespace: tssc-app-ci

# Vault wiring for the ExternalSecrets this chart renders.
vault:
  kvMount: secret
  pathPrefix: tssc-validated-pattern
  secretStoreName: vault-cluster
