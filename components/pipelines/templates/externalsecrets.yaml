{{- if .Values.pipelines.enabled }}
{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
{{- $ns := .Values.pipelineNamespace }}
# -----------------------------------------------------------------------------
# The two hand-made Secrets of the old runbook, now materialized from Vault
# by ESO in the pipeline namespace:
#
#   tpa-secret       what the upload/analysis tasks authenticate with. The
#                    client secret comes from the SAME Vault entry as
#                    oidc-tpa-cli (RHTPA) and the Keycloak tpa-cli client,
#                    so the three cannot drift; the URLs are chart values.
#   ai-agent-secret  the AI backend key (OPENAI_API_KEY for the
#                    gpt-oss-120b-a5b endpoint the deployer injected).
#
# NOTE the ai-agent-secret carries ONLY the key: an AI_PROVIDER key here
# would override the ai-agent-config ConfigMap (envFrom: last source wins)
# and the only symptom would be the wrong SDK being used.
#
# Rendered by this component (not the tekton-config plain-YAML Application)
# because plain YAML cannot template the Vault path or the cluster URLs.
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tpa-secret
  namespace: {{ $ns }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.pipelines.syncWaves.clusterDefaults | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: tpa-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        bombastic_api_url: {{ .Values.tpa.url | quote }}
        oidc_issuer_url: {{ .Values.oidc.issuerUrl | quote }}
        oidc_client_id: tpa-cli
  data:
    - secretKey: oidc_client_secret
      remoteRef:
        key: {{ printf "%s/tpa-cli-client-secret" $prefix | quote }}
        property: client-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-agent-secret
  namespace: {{ $ns }}
  labels:
    {{- include "pipelines.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.pipelines.syncWaves.clusterDefaults | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: ai-agent-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ printf "%s/ai-api-key" $prefix | quote }}
        property: api-key
{{- end }}
