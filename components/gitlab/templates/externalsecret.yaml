{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
# -----------------------------------------------------------------------------
# The GitLab root password, materialized from Vault by ESO. Consumed by the
# GitLab Deployment (env GITLAB_ROOT_PASSWORD) -- the seeding Job does not
# need it: it mints a root personal access token by exec'ing rails inside the
# pod.
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gitlab.rootPasswordSecret | default "tssc-gitlab-root-password" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitlab
    app.kubernetes.io/part-of: tssc-validated-pattern
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gitlab.rootPasswordSecret | default "tssc-gitlab-root-password" }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/gitlab-root-password" $prefix | quote }}
        property: password
