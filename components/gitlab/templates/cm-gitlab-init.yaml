{{- $root := . }}
{{- $host := include "gitlab.host" . }}
{{- $pipelineNs := .Values.pipeline.namespace }}
{{- $pacUrl := "" }}
{{- if .Values.cluster.subdomain }}
{{- $pacUrl = printf "https://pipelines-as-code-controller-openshift-pipelines.%s" .Values.cluster.subdomain }}
{{- end }}
# -----------------------------------------------------------------------------
# GitLab seeding playbook, run once by job-gitlab-init.
#
# Adapted from redhat-ads-tech/ocp-app-platform-demo-helm v1.4.2. Removed:
# the DevSpaces OAuth application. Added: per-repository labels, a
# project access token written into the pipeline namespace, the imported
# gitops repository with its own token, the Quay retarget of that
# repository's chart, the PaC wiring -- a project token for PaC, the
# .tekton/ PipelineRun definitions committed into the application repo, and
# the Repository CR that points PaC at it -- and BOTH GitLab webhooks per
# application repository: the PaC webhook (push / MR events, which PaC does
# not reliably create itself) and the issue-comment webhook pointing at the
# agentic-issue-commands EventListener (pipelines/triggers/), which is the
# only consumer that can match the /remediate and /generate-tests-* slash
# commands on issues.
#
# Everything is written to be re-runnable: the Job has backoffLimit 100 and
# Argo CD will re-sync it, so every call either tolerates the "already exists"
# status or checks first.
# -----------------------------------------------------------------------------
kind: ConfigMap
metadata:
  name:  cm-init-gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "3"
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: Configure GitLab
      hosts: localhost
      vars:
        gitlab_namespace: {{ $.Release.Namespace }}
        pipeline_namespace: {{ $pipelineNs }}
        gitlab_host: {{ $host }}
        # The PaC controller Route (in openshift-pipelines). Empty when a
        # custom gitlab.host is set without cluster.subdomain -- the PaC
        # webhook tasks skip themselves in that case.
        pac_webhook_url: {{ $pacUrl | quote }}
        user_create: true
      tasks:
        - name: Wait for GitLab pod to be ready
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: '{{ "{{" }} gitlab_namespace {{ "}}" }}'
            label_selectors:
              - app=gitlab
          register: r_gitlab_pod
          retries: 120
          delay: 10
          until:
            - r_gitlab_pod.resources is defined
            - r_gitlab_pod.resources | length > 0
            - r_gitlab_pod.resources[0].status is defined
            - r_gitlab_pod.resources[0].status.phase is defined
            - r_gitlab_pod.resources[0].status.phase == 'Running'
            - r_gitlab_pod.resources[0].status.containerStatuses is defined
            - r_gitlab_pod.resources[0].status.containerStatuses | selectattr('ready', 'equalto', true) | list | length == r_gitlab_pod.resources[0].status.containerStatuses | length

        - name: Wait for GitLab API to be available
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects
            method: GET
            validate_certs: false
          register: r_liveness
          retries: 60
          delay: 10
          until: r_liveness.status == 200

        - name: Generate root user personal token
          shell: |
            POD=$(oc get pod -l app=gitlab -n {{ $.Release.Namespace }} --no-headers | awk '{print $1}')
            oc exec $POD -n {{ $.Release.Namespace }} -- /bin/sh -c /scripts/create-root-pat.sh
            ROOT_PAT=$(oc exec $POD -n {{ $.Release.Namespace }} -- /bin/sh -c "cat /tmp/root.pat")
            oc delete secret root-user-personal-token -n {{ $.Release.Namespace }} --ignore-not-found
            oc create secret generic root-user-personal-token --from-literal=token=$ROOT_PAT -n {{ $.Release.Namespace }}

        - name: Retrieve root token
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: root-user-personal-token
            namespace: '{{ "{{" }} gitlab_namespace {{ "}}" }}'
          register: r_root_token
          failed_when: r_root_token.resources[0].data.token | length == 0

        - name: Decode root token
          set_fact:
            root_token: '{{ "{{" }} r_root_token.resources[0].data.token | b64decode {{ "}}" }}'

        - name: Update application settings
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/application/settings
            method: PUT
            body_format: form-urlencoded
            body:
              # `git` + `github` are what the repository imports below rely on;
              # without them POST /projects silently ignores import_url.
              import_sources: "git,github,gitea"
              version_check_enabled: "false"
              # The PaC webhook targets a Route served by this same cluster,
              # which GitLab treats as a local request and blocks by default.
              allow_local_requests_from_web_hooks_and_services: "true"
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          retries: 10
          delay: 5
          register: r_application_settings
          until: r_application_settings.status == 200

{{- range $item := .Values.gitlab.users.users }}

        - name: Create user {{ $item.id }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/users
            method: POST
            body_format: form-urlencoded
            body:
              admin: false
              email: {{ $item.id }}@rhdemo.com
              public_email: {{ $item.id }}@rhdemo.com
              skip_confirmation: true
              username: {{ $item.id }}
              password: {{ include "gitlab-user.password" $root }}
              name: {{ $item.name | default (printf "%s GitLab" $item.id) }}
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          register: r_user
          retries: 10
          delay: 5
          until: r_user.status in [201, 409]
{{- end }}

        - name: List users
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/users?per_page=100
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_users

{{- if .Values.gitops.repoUrl }}

        # ---- clone this repository for the application files --------------
        # The seeding Job reads the application and gitops source files from
        # the SAME repo Argo syncs from -- apps/<name>/application/ and
        # apps/<name>/gitops/ -- so the demo is fully contained in one repo.
        - name: Clone the GitOps repository for application files
          ansible.builtin.shell: |
            set -e
            rm -rf /tmp/repo
            git clone --quiet --depth 1 --branch {{ .Values.gitops.revision | default "main" }} \
              {{ .Values.gitops.repoUrl }} /tmp/repo
            echo "Cloned {{ .Values.gitops.repoUrl }} @ {{ .Values.gitops.revision | default "main" }} -> /tmp/repo"
          args:
            executable: /bin/bash
{{- end }}

{{- range $group := .Values.gitlab.groups }}

        - name: Create group {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/groups
            method: POST
            body_format: form-urlencoded
            body:
              name: {{ $group.name }}
              path: {{ $group.name }}
              visibility: public
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 400
              - 409
          register: r_group_create
          retries: 10
          delay: 5
          until: r_group_create.status in [201, 400, 409]
          failed_when:
            - r_group_create.status == 400
            - "'has already been taken' not in (r_group_create.json | default({}) | string)"

        - name: Look up group {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/groups/{{ $group.name }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_group

{{- range $repo := $group.repo }}
{{- $slug := printf "%s%%2F%s" $group.name $repo.name }}

        - name: Create project {{ $repo.name }} in {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects
            method: POST
            body_format: form-urlencoded
            body:
              name: {{ $repo.name }}
              visibility: public
              issues_access_level: enabled
              builds_access_level: enabled
              auto_devops_enabled: false
              remove_source_branch_after_merge: false
              only_allow_merge_if_pipeline_succeeds: {{ include "gitlab.repo.check-pipeline" $repo }}
              namespace_id: '{{ "{{" }} r_group.json.id {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 400
              - 409
          retries: 10
          delay: 5
          register: r_import
          until: r_import.status in [201, 400, 409]
          failed_when:
            - r_import.status == 400
            - "'has already been taken' not in (r_import.json | default({}) | string)"

{{- if $repo.source }}



        # Push the application files from the GitOps repo as the initial
        # commit. The seeding Job already cloned this repository (for the
        # PaC workflow definitions); `source` is a repo-relative path under
        # apps/. The GitLab commits API takes an `actions` array -- one
        # entry per file -- so the entire directory tree lands in a single
        # atomic commit. A project created with no import_url has an empty
        # repository (no branches), so the first file create also creates
        # the default branch.
        # Populate idempotency is decided by CONTENT, not by commit
        # count: the .tekton/ commits below land on an empty repo's
        # default branch and make "has any commits" true, which used to
        # permanently skip the source population for any repo whose
        # populate failed in an earlier, buggier run (the lightwell repos
        # sat for a day with nothing but .tekton in them). A repo needs
        # populating when its root tree holds nothing besides .tekton.
        # The tree call on a fully EMPTY repo returns 400/404 with a
        # {"message": ...} mapping -- selectattr('path', 'defined')
        # filters that out, and the empty result correctly means
        # "populate".
        - name: Check if {{ $repo.name }} is populated
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $slug }}/repository/tree?ref={{ $repo.defaultBranch | default "main" }}&per_page=100
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
              - 400
              - 404
          register: r_repo_tree

        - name: Populate {{ $repo.name }} from {{ $repo.source }}
          # Populate unless the root tree already holds non-.tekton
          # content (see the check task above for why commit count is
          # the wrong signal).
          when: >-
            r_import.status == 201
            or ((r_repo_tree.json | default([])) | selectattr('path', 'defined')
                 | map(attribute='path') | reject('search', '^\.tekton')
                 | list | length) == 0
          ansible.builtin.shell: /bin/bash /populate-scripts/populate-repo.sh '{{ $repo.source }}' '{{ $slug }}' '{{ $repo.defaultBranch | default "main" }}'
          environment:
            GITLAB_TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            GITLAB_HOST: '{{ $host }}'
{{- end }}

{{- if ne ($repo.defaultBranch | default "main") "main" }}

        - name: Set default branch for {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $slug }}
            method: PUT
            body_format: form-urlencoded
            body:
              default_branch: {{ $repo.defaultBranch }}
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          retries: 10
          delay: 5
          register: r_default_branch
          until: r_default_branch.status == 200
{{- end }}

        # Look up the project id (works whether the project was just created
        # or already existed from a previous run).
        - name: Look up project {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $slug }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_project_{{ $repo.name | replace "-" "_" }}
          retries: 10
          delay: 5
          until: r_project_{{ $repo.name | replace "-" "_" }}.status == 200

        - name: Remember the {{ $repo.name }} project id
          set_fact:
            project_id: '{{ "{{" }} r_project_{{ $repo.name | replace "-" "_" }}.json.id {{ "}}" }}'
{{- if and $repo.rewriteImageRepository ($repo.rewriteImageRepository.enabled | default false) }}
{{- $rewrite := $repo.rewriteImageRepository }}
{{- $targetRepo := printf "quay.%s/%s/%s" (required "Set cluster.subdomain" $root.Values.cluster.subdomain) $rewrite.quayOrganization $rewrite.component }}
{{- $branch := $repo.defaultBranch | default "main" }}

        # ---- retarget the chart at this cluster's Quay ----------------------
        # The imported repository carries the Quay host of the cluster its
        # chart was authored on (workshop clusters get a new domain on every
        # rebuild), and gitops-cd-dev only ever rewrites image.tag -- never
        # repository. Left alone, every environment would pull from a registry
        # that does not exist here. One commit on {{ $branch }}, made as root
        # (the project Owner, who can commit to the protected default branch),
        # retargets image.repository in the chart's base values for all
        # environments. Idempotent: the commit is skipped when the line already
        # points at this cluster.
        - name: Read {{ $rewrite.file }} on {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ $rewrite.file | urlquery }}?ref={{ $branch }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_chart_values

        - name: Retarget image.repository in {{ $repo.name }} to this cluster's Quay
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ $rewrite.file | urlquery }}
            method: PUT
            body_format: form-urlencoded
            body:
              branch: {{ $branch }}
              # NOTE: the pattern MUST use \s, NOT a POSIX class. Ansible's
              # regex_replace runs Python re, which has no [[:space:]]: it
              # parses that as the character set {:,s,p,a,c,e}, so
              # ^[[:space:]]*repository: can never match an indented
              # "  repository:" line. The task's when-guard then sees "no
              # change", skips the PUT, and the imported chart quietly
              # stays pointed at the authoring cluster's dead Quay (that
              # is exactly what happened to lightwell-java-demo-app-gitops
              # on cluster-dl265; spring-boot survived only via a manual
              # retarget commit). A single backslash is correct here: this
              # is a YAML single-quoted scalar inside a Helm template, and
              # neither layer touches backslashes -- the double-escaped
              # \\s that used to be here over-escaped and produced empty
              # commits.
              content: '{{ "{{" }} r_chart_values.json.content | b64decode | regex_replace("(?m)^\s*repository:.*$", "  repository: {{ $targetRepo }}") {{ "}}" }}'
              commit_message: "Point image.repository at this cluster's Quay"
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          # Skip when the rewrite would change nothing -- either the line
          # already points here (re-run on the same cluster) or the file has
          # no repository line at all (nothing this task should touch).
          when: >-
            r_chart_values.json.content | b64decode
            | regex_replace("(?m)^\s*repository:.*$", "  repository: {{ $targetRepo }}")
            != r_chart_values.json.content | b64decode
{{- end }}

{{- if $repo.labels }}

        - name: Create labels in {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/labels
            method: POST
            body_format: form-urlencoded
            body:
              name: '{{ "{{" }} item.name {{ "}}" }}'
              color: '{{ "{{" }} item.color {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          retries: 10
          delay: 5
          register: r_create_label
          until: r_create_label.status in [201, 409]
          loop:
{{- range $label := $repo.labels }}
            - name: {{ $label.name }}
              color: "{{ $label.color }}"
{{- end }}
{{- end }}

{{- if and (index $repo "pac" | default dict).enabled $pipelineNs }}
{{- $pacTok := (index $repo "pac") }}
{{- $branch := $repo.defaultBranch | default "main" }}

        # ---- Pipelines-as-Code wiring ----------------------------------------
        # No EventListener and no hand-made webhook: PaC watches the repo
        # through a Repository CR and creates the GitLab webhooks itself with
        # the project token minted below. The .tekton/ PipelineRun
        # definitions are committed into the repo (from the cm-pac-pipelines
        # ConfigMap rendered per cluster), because PaC only matches runs that
        # live in the repository it watches.

        # One token Secret PER REPOSITORY: a GitLab project access token is
        # scoped to exactly its own project (the project-bot user cannot be
        # granted any other), so a shared Secret would let the second
        # repository's Repository CR authenticate with the first one's
        # token and fail to read its own repo.
        - name: Look for an existing PaC token
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: gitlab-pac-token-{{ $repo.name }}
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_pac_secret

        - name: Decide whether a PaC token is needed
          set_fact:
            pac_token_needed: >-
              {{ "{{" }} not (r_pac_secret.resources | length > 0
                 and r_pac_secret.resources[0].data.token | default('') | length > 0) {{ "}}" }}

        - name: List project access tokens on {{ $repo.name }}
          when: pac_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_pac_pats

        - name: Revoke stale {{ $pacTok.tokenName | default "ssc-demo-pac" }} tokens
          when: pac_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens/{{ "{{" }} item.id {{ "}}" }}
            method: DELETE
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 204
              - 404
          loop: >-
            {{ "{{" }} (r_pac_pats.json | default([]))
               | selectattr('name', 'equalto', '{{ $pacTok.tokenName | default "ssc-demo-pac" }}')
               | selectattr('active', 'equalto', true) | list {{ "}}" }}

        - name: Create the PaC project access token
          when: pac_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: POST
            body_format: json
            body:
              name: {{ $pacTok.tokenName | default "ssc-demo-pac" }}
              # api: repo/webhook management + MR comments; write_repository
              # keeps parity with the SCM bot.
              scopes: ["api", "write_repository"]
              expires_at: '{{ "{{" }} "%Y-%m-%d" | strftime(ansible_date_time.epoch | int + 364*86400) {{ "}}" }}'
              access_level: 40
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          retries: 10
          delay: 5
          register: r_pac_pat
          until: r_pac_pat.status == 201 or r_pac_pat is skipped

        - name: Store the PaC token
          when: pac_token_needed | bool
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitlab-pac-token-{{ $repo.name }}
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
              type: Opaque
              stringData:
                token: '{{ "{{" }} r_pac_pat.json.token {{ "}}" }}'

        - name: Look for an existing PaC webhook secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: gitlab-pac-webhook
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_pac_webhook

        - name: Store the PaC webhook secret
          # The existence check MUST read the key this Secret actually
          # carries: webhook-secret. It previously read `secretToken` (the
          # EventListener secret's key), which is always absent here -- so
          # the condition was permanently true and the task REGENERATED the
          # shared secret on every run, once PER REPOSITORY. Each run ended
          # with the first repo's GitLab webhook holding a token from
          # before the last repo's regeneration, and every event for it
          # failed "token does not match configured secret".
          when: >-
            r_pac_webhook.resources | length == 0
            or r_pac_webhook.resources[0].data["webhook-secret"] | default('') | length == 0
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitlab-pac-webhook
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
              type: Opaque
              stringData:
                webhook-secret: '{{ "{{" }} lookup("ansible.builtin.password", "/dev/null", chars=["hexdigits"], length=40) | lower {{ "}}" }}'

        - name: Read the PaC pipeline definitions
          kubernetes.core.k8s_info:
            api_version: v1
            kind: ConfigMap
            name: cm-pac-pipelines
            namespace: '{{ "{{" }} gitlab_namespace {{ "}}" }}'
          register: r_pac_configmap
          failed_when: r_pac_configmap.resources | length == 0

        # The ConfigMap keys carry a --<repo-name> suffix (see
        # cm-pac-pipelines.yaml): filter to THIS repository's definitions
        # and strip the suffix when building the .tekton/ path, so each
        # repo gets only its own component config under the plain file
        # names PaC matches.
        - name: Check the committed .tekton definitions on {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ "{{" }} ('.tekton/' ~ (item.key | regex_replace('--{{ $repo.name }}$', ''))) | urlencode | regex_replace('/', '%2F') {{ "}}" }}?ref={{ $branch }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
              - 404
          register: r_pac_file
          loop: >-
            {{ "{{" }} r_pac_configmap.resources[0].data | dict2items | selectattr('key', 'search', '--{{ $repo.name }}$') | list {{ "}}" }}

        - name: Create missing .tekton definitions
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ "{{" }} ('.tekton/' ~ (item.item.key | regex_replace('--{{ $repo.name }}$', ''))) | urlencode | regex_replace('/', '%2F') {{ "}}" }}
            method: POST
            body_format: form-urlencoded
            body:
              branch: {{ $branch }}
              encoding: base64
              content: '{{ "{{" }} item.item.value | b64encode {{ "}}" }}'
              commit_message: 'Add Pipelines-as-Code definitions'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          loop: '{{ "{{" }} r_pac_file.results {{ "}}" }}'
          when: item.status == 404
          # Committed as root -- the project Owner, who can commit to the
          # protected default branch.

        - name: Update stale .tekton definitions
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ "{{" }} ('.tekton/' ~ (item.item.key | regex_replace('--{{ $repo.name }}$', ''))) | urlencode | regex_replace('/', '%2F') {{ "}}" }}
            method: PUT
            body_format: form-urlencoded
            body:
              branch: {{ $branch }}
              encoding: base64
              content: '{{ "{{" }} item.item.value | b64encode {{ "}}" }}'
              commit_message: 'Update Pipelines-as-Code definitions'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
          loop: '{{ "{{" }} r_pac_file.results {{ "}}" }}'
          when: >-
            item.status == 200
            and (item.json.content | b64decode) != item.item.value

        # Remove .tekton files that are no longer defined: the create and
        # update tasks above only ever ADD definitions, so a file dropped
        # from the ConfigMap (e.g. pull-request-verify.yaml, removed to stop
        # MR-opened verification runs) would otherwise keep matching events
        # forever. Anything committed under .tekton/ that is not in this
        # repository's ConfigMap keys gets deleted.
        - name: List committed .tekton files on {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/tree?path=.tekton&ref={{ $branch }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
              - 404
          register: r_tekton_tree

        - name: Remove stale .tekton files from {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ "{{" }} (('.tekton/' ~ item) | urlencode | regex_replace('/', '%2F')) {{ "}}" }}?branch={{ $branch }}&commit_message=Remove%20stale%20Pipelines-as-Code%20definition
            method: DELETE
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 204
              - 404
          loop: >-
            {{ "{{" }} ((r_tekton_tree.json | default([]) | selectattr('path', 'defined'))
              | map(attribute='path') | map('regex_replace', '^\.tekton/', '') | list
              | difference(r_pac_configmap.resources[0].data | dict2items
                  | selectattr('key', 'search', '--{{ $repo.name }}$')
                  | map(attribute='key') | map('regex_replace', '--{{ $repo.name }}$', '') | list)) {{ "}}" }}
          # 404 is tolerated: the tree listing can lag the deletes in this
          # very loop, each of which is its own commit.

        - name: Create the Pipelines-as-Code Repository CR for {{ $repo.name }}
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: pipelinesascode.tekton.dev/v1alpha1
              kind: Repository
              metadata:
                name: {{ $repo.name }}
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
              spec:
                # NO .git suffix: PaC (v0.50.x) matches the event URL with an
                # EXACT string compare (trailing "/" only) against
                # spec.url, and GitLab's webhook payload carries the
                # project's web_url, which has no .git. A .git-suffixed
                # Repository CR never matches any event -- every push logs
                # "cannot find a repository match" and no PipelineRun is
                # created. The clone URL PaC uses comes from the event
                # payload, not from this field, so dropping .git is safe.
                url: https://{{ $host }}/{{ $group.name }}/{{ $repo.name }}
                git_provider:
                  type: gitlab
                  url: https://{{ $host }}
                  secret:
                    name: gitlab-pac-token-{{ $repo.name }}
                    key: token
                  webhook_secret:
                    name: gitlab-pac-webhook
                    key: webhook-secret

        # ---- webhooks: PaC (push / MR) + EventListener (issue comments) ------
        # TWO webhooks per application repository, because no single consumer
        # understands every event:
        #
        #   1. The PaC webhook (push + merge-request + note events) points at
        #      the PaC controller Route and carries the gitlab-pac-webhook
        #      token, so PaC can validate it against the Repository CR's
        #      webhook_secret. PaC is *supposed* to create this webhook
        #      itself from the Repository CR, but does not reliably do so on
        #      this GitLab version -- so the seeding job creates it up front
        #      with the root token (PaC's project bot 403s on webhook
        #      creation for some projects).
        #   2. The issue-comment webhook (Note Hooks) points at the
        #      agentic-issue-commands EventListener Route and carries the
        #      gitlab-webhook-secret token. This is the ONLY way the
        #      /remediate and /generate-tests-* slash commands on ISSUES can
        #      start a pipeline: PaC matches push, MR and MR-comment events
        #      only, never an issue comment.
        #
        # note_events on webhook 1 delivers MR comments to PaC; note_events
        # on webhook 2 delivers both issue and MR comments to the
        # EventListener, whose cel filters drop everything that is not an
        # issue comment starting with a command. GitLab masks webhook tokens
        # on GET, so both hooks are looked up by URL and PUT unconditionally
        # to keep their token in step with the Secret.
        #
        # The EventListener half (gitlab-webhook-secret + the Note Hook
        # pointing at the Route) is gated on pac.issueCommands, which
        # bootstrap sets from components.tekton.enabled: without Tekton
        # there is no tekton-triggers Application, the Route below never
        # exists, and an ungated 30x10s wait would fail the whole play --
        # skipping the PaC webhook, the SCM credentials, and every later
        # repository's seeding. The PaC webhook itself stays ungated: it
        # fires into the void at worst, it never blocks.

        # Re-read: the earlier r_pac_webhook registration predates the
        # "Store the PaC webhook secret" task, so on a first run it is empty.
        - name: Read the PaC webhook secret back
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: gitlab-pac-webhook
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_pac_webhook

{{- if (($root.Values.pac | default dict).issueCommands | toString | ne "false") }}
        - name: Look for an existing EventListener webhook secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: gitlab-webhook-secret
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_el_webhook

        - name: Store the EventListener webhook secret
          when: >-
            r_el_webhook.resources | length == 0
            or r_el_webhook.resources[0].data.secretToken | default('') | length == 0
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitlab-webhook-secret
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
              type: Opaque
              stringData:
                secretToken: '{{ "{{" }} lookup("ansible.builtin.password", "/dev/null", chars=["hexdigits"], length=40) | lower {{ "}}" }}'

        - name: Read the EventListener webhook secret back
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: gitlab-webhook-secret
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_el_webhook

        - name: Wait for the EventListener Route on {{ $repo.name }}
          kubernetes.core.k8s_info:
            api_version: route.openshift.io/v1
            kind: Route
            name: agentic-issue-commands
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_el_route
          retries: 30
          delay: 10
          until:
            - r_el_route.resources | length > 0
            - r_el_route.resources[0].spec.host | default('') | length > 0
{{- end }}

        - name: List webhooks on {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/hooks
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_project_hooks

        - name: Create the PaC webhook on {{ $repo.name }}
          when: >-
            pac_webhook_url | length > 0
            and (r_project_hooks.json | selectattr('url', 'equalto', pac_webhook_url) | list | length == 0)
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/hooks
            method: POST
            body_format: json
            body:
              url: '{{ "{{" }} pac_webhook_url {{ "}}" }}'
              token: '{{ "{{" }} r_pac_webhook.resources[0].data["webhook-secret"] | b64decode {{ "}}" }}'
              push_events: true
              merge_requests_events: true
              # note events carry MR comments (the /generate-tests-* MR
              # commands); PaC ignores the issue comments that also arrive.
              note_events: true
              enable_ssl_verification: false
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          retries: 10
          delay: 5
          register: r_pac_hook
          until: r_pac_hook.status == 201 or r_pac_hook is skipped

        - name: Refresh the PaC webhook on {{ $repo.name }}
          when: >-
            pac_webhook_url | length > 0
            and (r_project_hooks.json | selectattr('url', 'equalto', pac_webhook_url) | list | length > 0)
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/hooks/{{ "{{" }} (r_project_hooks.json | selectattr('url', 'equalto', pac_webhook_url) | list)[0].id {{ "}}" }}
            method: PUT
            body_format: json
            body:
              url: '{{ "{{" }} pac_webhook_url {{ "}}" }}'
              token: '{{ "{{" }} r_pac_webhook.resources[0].data["webhook-secret"] | b64decode {{ "}}" }}'
              push_events: true
              merge_requests_events: true
              note_events: true
              enable_ssl_verification: false
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200

{{- if (($root.Values.pac | default dict).issueCommands | toString | ne "false") }}
        - name: Create the issue-comment webhook on {{ $repo.name }}
          vars:
            el_url: '{{ "{{" }} "https://" ~ r_el_route.resources[0].spec.host {{ "}}" }}'
          when: >-
            r_project_hooks.json | selectattr('url', 'equalto', el_url) | list | length == 0
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/hooks
            method: POST
            body_format: json
            body:
              url: '{{ "{{" }} el_url {{ "}}" }}'
              token: '{{ "{{" }} r_el_webhook.resources[0].data["secretToken"] | b64decode {{ "}}" }}'
              # Note Hooks only: issue AND MR comments arrive here, and the
              # EventListener's cel filters keep just the issue commands.
              note_events: true
              push_events: false
              merge_requests_events: false
              enable_ssl_verification: false
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          retries: 10
          delay: 5
          register: r_el_hook
          until: r_el_hook.status == 201 or r_el_hook is skipped

        - name: Refresh the issue-comment webhook on {{ $repo.name }}
          vars:
            el_url: '{{ "{{" }} "https://" ~ r_el_route.resources[0].spec.host {{ "}}" }}'
          when: >-
            r_project_hooks.json | selectattr('url', 'equalto', el_url) | list | length > 0
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/hooks/{{ "{{" }} (r_project_hooks.json | selectattr('url', 'equalto', el_url) | list)[0].id {{ "}}" }}
            method: PUT
            body_format: json
            body:
              url: '{{ "{{" }} el_url {{ "}}" }}'
              token: '{{ "{{" }} r_el_webhook.resources[0].data["secretToken"] | b64decode {{ "}}" }}'
              note_events: true
              push_events: false
              merge_requests_events: false
              enable_ssl_verification: false
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200

        # ---- initial CI trigger ----------------------------------------------
        # The .tekton definitions above were committed BEFORE the webhooks
        # existed (and before the Repository CR did), so their push events
        # were LOST: on a fresh install PaC never fires the first CI run,
        # and demo-smoke's wait-for-ci-build times out with nothing to
        # chain onto (exactly what happened on cluster-hnjcl -- zero
        # ci-build-publish runs after a fully green install). Now that
        # BOTH webhooks are registered, create a marker file in the repo:
        # its push event is what actually starts the first CI run.
        # Create-only, like populate: a re-seed does not re-trigger.
        # NOT under .tekton/ -- PaC parses every file there and a non-YAML
        # marker would abort the whole event.
        - name: Check for the CI trigger marker on {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/.ci-trigger?ref={{ $branch }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
              - 404
          register: r_ci_trigger

        - name: Trigger the initial CI run for {{ $repo.name }}
          when: r_ci_trigger.status == 404
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/.ci-trigger
            method: POST
            body_format: form-urlencoded
            body:
              branch: {{ $branch }}
              encoding: base64
              # "initial CI trigger\n"
              content: aW5pdGlhbCBISSB0cmlnZ2VyCg==
              commit_message: Trigger the initial CI run
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
{{- end }}
{{- end }}

{{- if and $repo.accessToken ($repo.accessToken.enabled | default false) $pipelineNs }}
{{- $tok := $repo.accessToken }}

        # ---- pipeline SCM credential ---------------------------------------
        # open-pr and open-cve-issues authenticate with `scm-auth-secret` (the
        # application repository's token) in the pipeline namespace;
        # gitops-cd-dev's gitops-bump-image uses the gitops repository's own
        # `scm-auth-gitops-secret`. Minting them here is what lets the demo
        # come up without anyone pasting a PAT; one project access token per
        # repository (not the root PAT) keeps the blast radius to a single
        # project each. They cannot be shared: a GitLab project-bot user is a
        # member of exactly its own project and GitLab refuses to add it to any
        # other ("project bots cannot be added to other groups / projects"),
        # which is why the gitops repository gets a second token rather than a
        # membership grant for the first bot.
        #
        # The token value is only ever returned once, at creation. So: if the
        # Secret already holds one, leave everything alone. Otherwise revoke any
        # stale token of the same name -- its value is unrecoverable and it
        # would just accumulate -- and issue a fresh one.
        - name: Look for an existing SCM secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: {{ $tok.secretName | default "scm-auth-secret" }}
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_scm_secret

        - name: Decide whether an SCM token is needed
          set_fact:
            scm_token_needed: >-
              {{ "{{" }} not (r_scm_secret.resources | length > 0
                 and r_scm_secret.resources[0].data.token | default('') | length > 0
                 and (r_scm_secret.resources[0].data.token | b64decode) != 'REPLACE_ME') {{ "}}" }}

        - name: List project access tokens on {{ $repo.name }}
          when: scm_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_pats

        - name: Revoke stale {{ $tok.name }} tokens
          when: scm_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens/{{ "{{" }} item.id {{ "}}" }}
            method: DELETE
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 204
              - 404
          loop: >-
            {{ "{{" }} (r_pats.json | default([]))
               | selectattr('name', 'equalto', '{{ $tok.name }}')
               | selectattr('active', 'equalto', true) | list {{ "}}" }}

        - name: Create project access token {{ $tok.name }}
          when: scm_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: POST
            body_format: json
            body:
              name: {{ $tok.name }}
              scopes: {{ $tok.scopes | default (list "api" "write_repository") | toJson }}
              # GitLab 16+ requires an expiry and rejects anything more than a
              # year out, so expiresInDays stays just inside the cap.
              expires_at: '{{ "{{" }} "%Y-%m-%d" | strftime(ansible_date_time.epoch | int + {{ mul (int ($tok.expiresInDays | default 364)) 86400 }}) {{ "}}" }}'
              access_level: {{ $tok.accessLevel | default 40 }}
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          retries: 10
          delay: 5
          register: r_pat
          until: r_pat.status == 201 or r_pat is skipped

        - name: Store the SCM credential for the pipelines
          when: scm_token_needed | bool
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ $tok.secretName | default "scm-auth-secret" }}
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: maven-build-ci
              type: Opaque
              stringData:
                # glab and `git push https://<user>:<token>@...` both expect
                # oauth2 as the username for a GitLab token.
                username: oauth2
                token: '{{ "{{" }} r_pat.json.token {{ "}}" }}'
                # The cluster-resolved git-clone task expects a `password`
                # key (its kubernetes.io/basic-auth compatibility path reads
                # username + password); without it the clone step dies with
                # "Unknown basic-auth workspace format". The open-pr and
                # open-cve-issues tasks read `token` directly. Same value,
                # two keys, both consumers work.
                password: '{{ "{{" }} r_pat.json.token {{ "}}" }}'
{{- end }}
{{- end }}

{{- range $project := $group.project }}

        - name: Create project {{ $project.name }} in {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects
            method: POST
            body_format: form-urlencoded
            body:
              name: {{ $project.name }}
              visibility: public
              issues_access_level: enabled
              auto_devops_enabled: false
              remove_source_branch_after_merge: false
              namespace_id: '{{ "{{" }} r_group.json.id {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 400
              - 409
          retries: 10
          delay: 5
          register: r_create_project_result
          until: r_create_project_result.status in [201, 400, 409]
          failed_when:
            - r_create_project_result.status == 400
            - "'has already been taken' not in (r_create_project_result.json | default({}) | string)"

        - name: Look up project {{ $project.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $group.name }}%2F{{ $project.name }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_create_project

{{- if $project.labels }}

        - name: Create labels in {{ $project.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} r_create_project.json.id {{ "}}" }}/labels
            method: POST
            body_format: form-urlencoded
            body:
              name: '{{ "{{" }} item.name {{ "}}" }}'
              color: '{{ "{{" }} item.color {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          retries: 10
          delay: 5
          register: r_create_label
          until: r_create_label.status in [201, 409]
          loop:
{{- range $label := $project.labels }}
            - name: {{ $label.name }}
              color: "{{ $label.color }}"
{{- end }}
{{- end }}
{{- end }}

{{- range $member := $group.users }}

        - name: Add user {{ $member.id }} to {{ $group.name }}
          when: item.username == '{{ $member.id }}'
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/groups/{{ "{{" }} r_group.json.id {{ "}}" }}/members
            method: POST
            body_format: form-urlencoded
            body:
              user_id: '{{ "{{" }} item.id {{ "}}" }}'
              access_level: 50
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          register: r_group_user
          retries: 10
          delay: 5
          until: r_group_user.status in [201, 409] or r_group_user is skipped
          loop: '{{ "{{" }} r_users.json {{ "}}" }}'
{{- end }}
{{- end }}

{{- /* pipelineRuns defaults to TRUE when unset -- but `| default true`
       cannot express that, because the default filter fires on ANY falsy
       value, including an explicit false (false | default true == true!).
       hasKey distinguishes "not configured" from "configured false". */}}
{{- $pipelineRuns := true }}
{{- if hasKey .Values.pac "pipelineRuns" }}{{ $pipelineRuns = .Values.pac.pipelineRuns }}{{ end }}
{{- if and .Values.pac.enabled $pipelineRuns $pipelineNs }}

{{- range $group := .Values.gitlab.groups }}
{{- range $repo := $group.repo }}
{{- if and $repo.rewriteImageRepository ($repo.rewriteImageRepository.enabled | default false) }}
{{- $rewrite := $repo.rewriteImageRepository }}
{{- $secret := "scm-auth-gitops-secret" }}
{{- if $repo.accessToken }}{{ $secret = $repo.accessToken.secretName | default "scm-auth-gitops-secret" }}{{ end }}
{{- $chartPath := dir $rewrite.file }}

        # =================================================================
        # Install-time smoke for {{ $rewrite.component }}: build once and
        # promote through dev/qa/prod, so every environment Application
        # lands Healthy. They start Degraded by design -- Argo creates each
        # Deployment while image.tag is still the initial "latest", a tag
        # nothing ever pushes -- and without this the board stays red until
        # someone runs the promotions by hand (see
        # pipelines/pipelines/demo-smoke.yaml for the full story).
        #
        # Everything below is derived from the gitops entry's
        # rewriteImageRepository block -- the single place the
        # component / gitops-repo / chart-path mapping lives: the app repo
        # is <group>/<rewrite.component>, the chart lives under
        # {{ $chartPath }}, and the gitops bot secret is {{ $secret }}.
        # =================================================================

        - name: Wait for the demo-smoke Pipeline to be installed
          kubernetes.core.k8s_info:
            api_version: tekton.dev/v1
            kind: Pipeline
            namespace: {{ $pipelineNs }}
            name: demo-smoke
          register: r_smoke_pipeline
          # The Pipeline is synced by the tekton-pipelines Application
          # (root-app waves 3-5); this job can start first, so retry until
          # it lands rather than assuming ordering.
          #
          # The until MUST guard on failure first: a failed lookup (a 403
          # from missing RBAC, an API hiccup) returns a dict with NO
          # "resources" key, and reading .resources on it crashes the
          # conditional evaluation itself -- the task dies on attempt one
          # instead of retrying, which is exactly how this play first
          # failed (the SA held pipelineruns rights but not pipelines).
          # The `is not failed` guard short-circuits the `and`, so a
          # failed attempt retries instead of aborting.
          until: r_smoke_pipeline is not failed and (r_smoke_pipeline.resources | default([]) | length > 0)
          retries: 90
          delay: 10

        - name: Check for an existing demo-smoke run for {{ $rewrite.component }}
          kubernetes.core.k8s_info:
            api_version: tekton.dev/v1
            kind: PipelineRun
            namespace: {{ $pipelineNs }}
            name: demo-smoke-{{ $rewrite.component }}
          register: r_smoke_run

        # Create-only, on purpose. Tekton's validating webhook rejects ANY
        # spec update to a completed PipelineRun ("Once the PipelineRun is
        # complete, no updates are allowed"), and the creation-time
        # defaulting webhook adds fields the rendered manifest lacks -- so a
        # converge-style patch on an existing run ALWAYS fires and is ALWAYS
        # rejected, failing the whole seeding on re-seed. Looking first and
        # skipping when present is what actually implements the fixed-name
        # policy; delete the PipelineRun (and re-sync) to run the smoke
        # again.
        - name: Start the demo-smoke PipelineRun for {{ $rewrite.component }}
          when: (r_smoke_run.resources | default([]) | length) == 0
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                # Fixed name; the create-only guard above makes a re-seed
                # leave the existing run alone. Delete the PipelineRun
                # first (and re-sync) to run the smoke again.
                name: demo-smoke-{{ $rewrite.component }}
                namespace: {{ $pipelineNs }}
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
                  tekton.dev/pipeline: demo-smoke
              spec:
                pipelineRef:
                  name: demo-smoke
                taskRunTemplate:
                  serviceAccountName: pipeline
                # 2h covers the 90m CI wait plus the three promotions.
                timeouts:
                  pipeline: 2h0m0s
                params:
                  - name: app-repo-url
                    value: https://{{ $host }}/{{ $group.name }}/{{ $rewrite.component }}
                  - name: gitops-url
                    value: https://{{ $host }}/{{ $group.name }}/{{ $repo.name }}
                  - name: git-host
                    value: {{ $host }}
                  # The gitops repo's own default branch: hard-coding main
                  # would break promotion MRs for a repo configured with a
                  # different defaultBranch.
                  - name: base-branch
                    value: {{ $repo.defaultBranch | default "main" }}
                  - name: dev-values-path
                    value: {{ $chartPath }}/environments/dev/values.yaml
                  - name: qa-values-path
                    value: {{ $chartPath }}/environments/qa/values.yaml
                  - name: prod-values-path
                    value: {{ $chartPath }}/environments/prod/values.yaml
                  - name: scm-secret-name
                    value: {{ $secret }}
{{- end }}
{{- end }}
{{- end }}

{{- $quay := printf "quay.%s" (required "Set cluster.subdomain" .Values.cluster.subdomain) }}

        # =================================================================
        # Agentic CVE analysis for every example application: the same run
        # an operator starts by hand (tkn pipeline start agentic-cve-analysis
        # ...), started once at install time so the demo opens with CVE
        # issues already filed on the boards. It builds its own :analysis
        # image and is independent of the smoke above.
        #
        # The WAITS below are not optional: a PipelineRun whose secret-backed
        # workspace (maven-settings / git-auth) binds a missing Secret hangs
        # its pod in PodInitializing FOREVER rather than failing, burning the
        # whole 3h pipeline timeout. maven-settings is written by the
        # Artifactory component's post-install Job -- the slowest thing on a
        # fresh cluster -- so it gets twice the retry budget of the rest.
        # =================================================================

        - name: Wait for the agentic-cve-analysis Pipeline to be installed
          kubernetes.core.k8s_info:
            api_version: tekton.dev/v1
            kind: Pipeline
            namespace: {{ $pipelineNs }}
            name: agentic-cve-analysis
          register: r_analysis_pipeline
          until: r_analysis_pipeline is not failed and (r_analysis_pipeline.resources | default([]) | length > 0)
          retries: 90
          delay: 10

        - name: Wait for the tpa-secret Secret (RHTPA upload credentials)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: {{ $pipelineNs }}
            name: tpa-secret
          register: r_tpa_secret
          until: r_tpa_secret is not failed and (r_tpa_secret.resources | default([]) | length > 0)
          retries: 90
          delay: 10

        - name: Wait for the ai-agent-secret Secret (the CVE analyzer's API key)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: {{ $pipelineNs }}
            name: ai-agent-secret
          register: r_ai_secret
          until: r_ai_secret is not failed and (r_ai_secret.resources | default([]) | length > 0)
          retries: 90
          delay: 10

        - name: Wait for the maven-settings Secret (Artifactory-backed resolution)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: {{ $pipelineNs }}
            name: maven-settings
          register: r_maven_settings
          until: r_maven_settings is not failed and (r_maven_settings.resources | default([]) | length > 0)
          retries: 180
          delay: 10

{{- range $group := .Values.gitlab.groups }}
{{- range $repo := $group.repo }}
{{- if (index $repo "pac" | default dict).enabled }}
{{- $scm := "scm-auth-secret" }}
{{- if $repo.accessToken }}{{ $scm = $repo.accessToken.secretName | default "scm-auth-secret" }}{{ end }}

        - name: Check for an existing cve-analysis run for {{ $repo.name }}
          kubernetes.core.k8s_info:
            api_version: tekton.dev/v1
            kind: PipelineRun
            namespace: {{ $pipelineNs }}
            name: cve-analysis-{{ $repo.name }}
          register: r_analysis_run

        # Create-only, for the same reason as the smoke runs above: a
        # completed PipelineRun rejects every spec update, and the
        # defaulting webhook guarantees the rendered manifest never
        # matches the live object -- so converge-patching an existing run
        # fails the whole seeding. Delete the PipelineRun (and re-sync)
        # to analyze again.
        - name: Start the agentic-cve-analysis PipelineRun for {{ $repo.name }}
          when: (r_analysis_run.resources | default([]) | length) == 0
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                name: cve-analysis-{{ $repo.name }}
                namespace: {{ $pipelineNs }}
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
                  tekton.dev/pipeline: agentic-cve-analysis
              spec:
                pipelineRef:
                  name: agentic-cve-analysis
                taskRunTemplate:
                  serviceAccountName: pipeline
                # The pipeline is ~40 min of RHTPA tasks plus 45-90 min of
                # model-gated analysis; the console's implicit 1h would kill
                # it, so this pins the same 3h the tkn invocation uses.
                timeouts:
                  pipeline: 3h0m0s
                params:
                  - name: component-name
                    value: {{ $repo.name }}
                  - name: git-url
                    value: https://{{ $host }}/{{ $group.name }}/{{ $repo.name }}.git
                  # The repo's configured default branch: hard-coding main
                  # would fail the clone for a repo whose defaultBranch is
                  # something else (populate commits defaultBranch, this run
                  # must check it out).
                  - name: revision
                    value: {{ $repo.defaultBranch | default "main" }}
                  - name: output-image
                    value: {{ $quay }}/tssc/{{ $repo.name }}:analysis
                  # The run starts while the wave-10 Quay component may
                  # still be configuring; the run waits for the push
                  # credential itself (see wait-for-registry -- the seeding
                  # job cannot, without deadlocking the later waves).
                  - name: registry-wait-timeout
                    value: 30m
                  # RHTPA is also wave 10, and the tpa-secret wait above
                  # only proves the SECRET exists (ESO reads Vault,
                  # independent of the RHTPA server) -- not that RHTPA
                  # accepts uploads. The run waits for that itself,
                  # concurrently with its build (wait-for-trustification).
                  - name: trustification-wait-timeout
                    value: 30m
                  - name: git-host
                    value: {{ $host }}
                  - name: scm-provider
                    value: gitlab
                  - name: scm-secret-name
                    value: {{ $scm }}
                workspaces:
                  - name: workspace
                    volumeClaimTemplate:
                      spec:
                        accessModes: [ReadWriteOnce]
                        resources:
                          requests:
                            storage: 5Gi
                  - name: maven-settings
                    secret:
                      secretName: maven-settings
                  # The repo's OWN project-bot token (a project bot is a
                  # member of exactly one project) -- this is also the
                  # secret open-cve-issues pushes issues with.
                  - name: git-auth
                    secret:
                      secretName: {{ $scm }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
