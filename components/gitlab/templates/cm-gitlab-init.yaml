{{- $root := . }}
{{- $host := include "gitlab.host" . }}
{{- $pipelineNs := .Values.pipeline.namespace }}
# -----------------------------------------------------------------------------
# GitLab seeding playbook, run once by job-gitlab-init.
#
# Adapted from redhat-ads-tech/ocp-app-platform-demo-helm v1.4.2. Removed:
# the DevSpaces OAuth application, and the EventListener webhooks (CI
# triggering is Pipelines-as-Code now). Added: per-repository labels, a
# project access token written into the pipeline namespace, the imported
# gitops repository with its own token, the Quay retarget of that
# repository's chart, and the PaC wiring -- a project token for PaC, the
# .tekton/ PipelineRun definitions committed into the application repo, and
# the Repository CR that points PaC at it.
#
# Everything is written to be re-runnable: the Job has backoffLimit 100 and
# Argo CD will re-sync it, so every call either tolerates the "already exists"
# status or checks first.
# -----------------------------------------------------------------------------
kind: ConfigMap
metadata:
  name:  cm-init-gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "3"
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: Configure GitLab
      hosts: localhost
      vars:
        gitlab_namespace: {{ $.Release.Namespace }}
        pipeline_namespace: {{ $pipelineNs }}
        gitlab_host: {{ $host }}
        user_create: true
      tasks:
        - name: Wait for GitLab pod to be ready
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: '{{ "{{" }} gitlab_namespace {{ "}}" }}'
            label_selectors:
              - app=gitlab
          register: r_gitlab_pod
          retries: 120
          delay: 10
          until:
            - r_gitlab_pod.resources is defined
            - r_gitlab_pod.resources | length > 0
            - r_gitlab_pod.resources[0].status is defined
            - r_gitlab_pod.resources[0].status.phase is defined
            - r_gitlab_pod.resources[0].status.phase == 'Running'
            - r_gitlab_pod.resources[0].status.containerStatuses is defined
            - r_gitlab_pod.resources[0].status.containerStatuses | selectattr('ready', 'equalto', true) | list | length == r_gitlab_pod.resources[0].status.containerStatuses | length

        - name: Wait for GitLab API to be available
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects
            method: GET
            validate_certs: false
          register: r_liveness
          retries: 60
          delay: 10
          until: r_liveness.status == 200

        - name: Generate root user personal token
          shell: |
            POD=$(oc get pod -l app=gitlab -n {{ $.Release.Namespace }} --no-headers | awk '{print $1}')
            oc exec $POD -n {{ $.Release.Namespace }} -- /bin/sh -c /scripts/create-root-pat.sh
            ROOT_PAT=$(oc exec $POD -n {{ $.Release.Namespace }} -- /bin/sh -c "cat /tmp/root.pat")
            oc delete secret root-user-personal-token -n {{ $.Release.Namespace }} --ignore-not-found
            oc create secret generic root-user-personal-token --from-literal=token=$ROOT_PAT -n {{ $.Release.Namespace }}

        - name: Retrieve root token
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: root-user-personal-token
            namespace: '{{ "{{" }} gitlab_namespace {{ "}}" }}'
          register: r_root_token
          failed_when: r_root_token.resources[0].data.token | length == 0

        - name: Decode root token
          set_fact:
            root_token: '{{ "{{" }} r_root_token.resources[0].data.token | b64decode {{ "}}" }}'

        - name: Update application settings
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/application/settings
            method: PUT
            body_format: form-urlencoded
            body:
              # `git` + `github` are what the repository imports below rely on;
              # without them POST /projects silently ignores import_url.
              import_sources: "git,github,gitea"
              version_check_enabled: "false"
              # The PaC webhook targets a Route served by this same cluster,
              # which GitLab treats as a local request and blocks by default.
              allow_local_requests_from_web_hooks_and_services: "true"
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          retries: 10
          delay: 5
          register: r_application_settings
          until: r_application_settings.status == 200

{{- range $item := .Values.gitlab.users.users }}

        - name: Create user {{ $item.id }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/users
            method: POST
            body_format: form-urlencoded
            body:
              admin: false
              email: {{ $item.id }}@rhdemo.com
              public_email: {{ $item.id }}@rhdemo.com
              skip_confirmation: true
              username: {{ $item.id }}
              password: {{ include "gitlab-user.password" $root }}
              name: {{ $item.name | default (printf "%s GitLab" $item.id) }}
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          register: r_user
          retries: 10
          delay: 5
          until: r_user.status in [201, 409]
{{- end }}

        - name: List users
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/users?per_page=100
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_users

{{- if .Values.gitops.repoUrl }}

        # ---- clone this repository for the application files --------------
        # The seeding Job reads the application and gitops source files from
        # the SAME repo Argo syncs from -- apps/<name>/application/ and
        # apps/<name>/gitops/ -- so the demo is fully contained in one repo.
        - name: Clone the GitOps repository for application files
          ansible.builtin.shell: |
            set -e
            rm -rf /tmp/repo
            git clone --quiet --depth 1 --branch {{ .Values.gitops.revision | default "main" }} \
              {{ .Values.gitops.repoUrl }} /tmp/repo
            echo "Cloned {{ .Values.gitops.repoUrl }} @ {{ .Values.gitops.revision | default "main" }} -> /tmp/repo"
          args:
            executable: /bin/bash
{{- end }}

{{- range $group := .Values.gitlab.groups }}

        - name: Create group {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/groups
            method: POST
            body_format: form-urlencoded
            body:
              name: {{ $group.name }}
              path: {{ $group.name }}
              visibility: public
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 400
              - 409
          register: r_group_create
          retries: 10
          delay: 5
          until: r_group_create.status in [201, 400, 409]
          failed_when:
            - r_group_create.status == 400
            - "'has already been taken' not in (r_group_create.json | default({}) | string)"

        - name: Look up group {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/groups/{{ $group.name }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_group

{{- range $repo := $group.repo }}
{{- $slug := printf "%s%%2F%s" $group.name $repo.name }}

        - name: Create project {{ $repo.name }} in {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects
            method: POST
            body_format: form-urlencoded
            body:
              name: {{ $repo.name }}
              visibility: public
              issues_access_level: enabled
              builds_access_level: enabled
              auto_devops_enabled: false
              remove_source_branch_after_merge: false
              only_allow_merge_if_pipeline_succeeds: {{ include "gitlab.repo.check-pipeline" $repo }}
              namespace_id: '{{ "{{" }} r_group.json.id {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 400
              - 409
          retries: 10
          delay: 5
          register: r_import
          until: r_import.status in [201, 400, 409]
          failed_when:
            - r_import.status == 400
            - "'has already been taken' not in (r_import.json | default({}) | string)"

{{- if $repo.source }}



        # Push the application files from the GitOps repo as the initial
        # commit. The seeding Job already cloned this repository (for the
        # PaC workflow definitions); `source` is a repo-relative path under
        # apps/. The GitLab commits API takes an `actions` array -- one
        # entry per file -- so the entire directory tree lands in a single
        # atomic commit. A project created with no import_url has an empty
        # repository (no branches), so the first file create also creates
        # the default branch.
        - name: Check if {{ $repo.name }} has any commits
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $slug }}/repository/commits?per_page=1
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
              - 404
          register: r_repo_commits
          # 200 with an empty array means the repo has no commits

        - name: Populate {{ $repo.name }} from {{ $repo.source }}
          # GitLab returns 200 with an EMPTY ARRAY for a repo with no
          # commits (not 404), so check the body, not the status code.
          when: r_import.status == 201 or (r_repo_commits.json | default([]) | length) == 0
          ansible.builtin.shell: |
            set -e
            SOURCE_DIR="/tmp/repo/{{ $repo.source }}"
            [ -d "{{ "{{" }} SOURCE_DIR {{ "}}" }}" ] || { echo "ERROR: {{ $repo.source }} not found in the cloned repo"; exit 1; }

            # Build the actions JSON array (one create per file)
            ACTIONS="["
            FIRST=true
            while IFS= read -r -d '' FILE; do
              REL_PATH="${FILE#{{ "{{" }} SOURCE_DIR {{ "}}" }}/}"
              CONTENT_B64=$(base64 -w 0 < "{{ "{{" }} FILE {{ "}}" }}")
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                ACTIONS+=","
              fi
              ACTIONS+="{\"action\":\"create\",\"file_path\":\"${REL_PATH}\",\"encoding\":\"base64\",\"content\":\"${CONTENT_B64}\"}"
            done < <(find "{{ "{{" }} SOURCE_DIR {{ "}}" }}" -type f -print0)
            ACTIONS+="]"

            # Count files (for the log)
            FILE_COUNT=$(echo "{{ "{{" }} ACTIONS {{ "}}" }}" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')
            echo "Committing ${FILE_COUNT} files to {{ $repo.name }}"

            # Push as the initial commit via the commits API
            RESP=$(curl -s --request POST \
              "https://{{ $host }}/api/v4/projects/{{ $slug }}/repository/commits" \
              --header "PRIVATE-TOKEN: {{ "{{" }} root_token {{ "}}" }}" \
              --header "Content-Type: application/json" \
              --data "{{ "{{" }} ACTIONS | python3 -c 'import json,sys;a=json.load(sys.stdin);print(json.dumps({"branch":"{{ $repo.defaultBranch | default "main" }}","commit_message":"Initial import from tssc-validated-pattern","actions":a}))' {{ "}}" }}")
            echo "$RESP" | python3 -c '
            import json,sys
            r=json.load(sys.stdin)
            if "id" in r:
                print("  committed:", r.get("short_id","?"), "on", r.get("branch","?"))
            else:
                print("  ERROR:", json.dumps(r)[:200]); sys.exit(1)'
          args:
            executable: /bin/bash
{{- end }}

{{- if ne ($repo.defaultBranch | default "main") "main" }}

        - name: Set default branch for {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $slug }}
            method: PUT
            body_format: form-urlencoded
            body:
              default_branch: {{ $repo.defaultBranch }}
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          retries: 10
          delay: 5
          register: r_default_branch
          until: r_default_branch.status == 200
{{- end }}

        # Look up the project id (works whether the project was just created
        # or already existed from a previous run).
        - name: Look up project {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $slug }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_project_{{ $repo.name | replace "-" "_" }}
          retries: 10
          delay: 5
          until: r_project_{{ $repo.name | replace "-" "_" }}.status == 200

        - name: Remember the {{ $repo.name }} project id
          set_fact:
            project_id: '{{ "{{" }} r_project_{{ $repo.name | replace "-" "_" }}.json.id {{ "}}" }}'
{{- if and $repo.rewriteImageRepository ($repo.rewriteImageRepository.enabled | default false) }}
{{- $rewrite := $repo.rewriteImageRepository }}
{{- $targetRepo := printf "quay.%s/%s/%s" (required "Set cluster.subdomain" $root.Values.cluster.subdomain) $rewrite.quayOrganization $rewrite.component }}
{{- $branch := $repo.defaultBranch | default "main" }}

        # ---- retarget the chart at this cluster's Quay ----------------------
        # The imported repository carries the Quay host of the cluster its
        # chart was authored on (workshop clusters get a new domain on every
        # rebuild), and gitops-cd-dev only ever rewrites image.tag -- never
        # repository. Left alone, every environment would pull from a registry
        # that does not exist here. One commit on {{ $branch }}, made as root
        # (the project Owner, who can commit to the protected default branch),
        # retargets image.repository in the chart's base values for all
        # environments. Idempotent: the commit is skipped when the line already
        # points at this cluster.
        - name: Read {{ $rewrite.file }} on {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ $rewrite.file | urlquery }}?ref={{ $branch }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_chart_values

        - name: Retarget image.repository in {{ $repo.name }} to this cluster's Quay
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ $rewrite.file | urlquery }}
            method: PUT
            body_format: form-urlencoded
            body:
              branch: {{ $branch }}
              # NOTE: the pattern is deliberately BACKSLASH-FREE. The
              # double-escaped \\s / \\1 that used to be here survived
              # Helm and YAML differently than expected inside Ansible's
              # Jinja: the PUT fired but committed identical content (an
              # empty commit), leaving the imported chart pointed at the
              # authoring cluster's Quay. [[:space:]] and a literal
              # replacement avoid the whole escaping question.
              content: '{{ "{{" }} r_chart_values.json.content | b64decode | regex_replace("(?m)^[[:space:]]*repository:.*$", "  repository: {{ $targetRepo }}") {{ "}}" }}'
              commit_message: "Point image.repository at this cluster's Quay"
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          # Skip when the rewrite would change nothing -- either the line
          # already points here (re-run on the same cluster) or the file has
          # no repository line at all (nothing this task should touch).
          when: >-
            r_chart_values.json.content | b64decode
            | regex_replace("(?m)^[[:space:]]*repository:.*$", "  repository: {{ $targetRepo }}")
            != r_chart_values.json.content | b64decode
{{- end }}

{{- if $repo.labels }}

        - name: Create labels in {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/labels
            method: POST
            body_format: form-urlencoded
            body:
              name: '{{ "{{" }} item.name {{ "}}" }}'
              color: '{{ "{{" }} item.color {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          retries: 10
          delay: 5
          register: r_create_label
          until: r_create_label.status in [201, 409]
          loop:
{{- range $label := $repo.labels }}
            - name: {{ $label.name }}
              color: "{{ $label.color }}"
{{- end }}
{{- end }}

{{- if and (index $repo "pac" | default dict).enabled $pipelineNs }}
{{- $pacTok := (index $repo "pac") }}
{{- $branch := $repo.defaultBranch | default "main" }}

        # ---- Pipelines-as-Code wiring ----------------------------------------
        # No EventListener and no hand-made webhook: PaC watches the repo
        # through a Repository CR and creates the GitLab webhooks itself with
        # the project token minted below. The .tekton/ PipelineRun
        # definitions are committed into the repo (from the cm-pac-pipelines
        # ConfigMap rendered per cluster), because PaC only matches runs that
        # live in the repository it watches.

        - name: Look for an existing PaC token
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: gitlab-pac-token
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_pac_secret

        - name: Decide whether a PaC token is needed
          set_fact:
            pac_token_needed: >-
              {{ "{{" }} not (r_pac_secret.resources | length > 0
                 and r_pac_secret.resources[0].data.token | default('') | length > 0) {{ "}}" }}

        - name: List project access tokens on {{ $repo.name }}
          when: pac_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_pac_pats

        - name: Revoke stale {{ $pacTok.tokenName | default "ssc-demo-pac" }} tokens
          when: pac_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens/{{ "{{" }} item.id {{ "}}" }}
            method: DELETE
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 204
              - 404
          loop: >-
            {{ "{{" }} (r_pac_pats.json | default([]))
               | selectattr('name', 'equalto', '{{ $pacTok.tokenName | default "ssc-demo-pac" }}')
               | selectattr('active', 'equalto', true) | list {{ "}}" }}

        - name: Create the PaC project access token
          when: pac_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: POST
            body_format: json
            body:
              name: {{ $pacTok.tokenName | default "ssc-demo-pac" }}
              # api: repo/webhook management + MR comments; write_repository
              # keeps parity with the SCM bot.
              scopes: ["api", "write_repository"]
              expires_at: '{{ "{{" }} "%Y-%m-%d" | strftime(ansible_date_time.epoch | int + 364*86400) {{ "}}" }}'
              access_level: 40
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          retries: 10
          delay: 5
          register: r_pac_pat
          until: r_pac_pat.status == 201 or r_pac_pat is skipped

        - name: Store the PaC token
          when: pac_token_needed | bool
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitlab-pac-token
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
              type: Opaque
              stringData:
                token: '{{ "{{" }} r_pac_pat.json.token {{ "}}" }}'

        - name: Look for an existing PaC webhook secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: gitlab-pac-webhook
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_pac_webhook

        - name: Store the PaC webhook secret
          when: >-
            r_pac_webhook.resources | length == 0
            or r_pac_webhook.resources[0].data.secretToken | default('') | length == 0
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitlab-pac-webhook
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
              type: Opaque
              stringData:
                webhook-secret: '{{ "{{" }} lookup("ansible.builtin.password", "/dev/null", chars=["hexdigits"], length=40) | lower {{ "}}" }}'

        - name: Read the PaC pipeline definitions
          kubernetes.core.k8s_info:
            api_version: v1
            kind: ConfigMap
            name: cm-pac-pipelines
            namespace: '{{ "{{" }} gitlab_namespace {{ "}}" }}'
          register: r_pac_configmap
          failed_when: r_pac_configmap.resources | length == 0

        - name: Check the committed .tekton definitions on {{ $repo.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ "{{" }} ('.tekton/' ~ item.key) | urlencode | regex_replace('/', '%2F') {{ "}}" }}?ref={{ $branch }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
              - 404
          register: r_pac_file
          loop: >-
            {{ "{{" }} r_pac_configmap.resources[0].data | dict2items {{ "}}" }}

        - name: Create missing .tekton definitions
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ "{{" }} ('.tekton/' ~ item.item.key) | urlencode | regex_replace('/', '%2F') {{ "}}" }}
            method: POST
            body_format: form-urlencoded
            body:
              branch: {{ $branch }}
              encoding: base64
              content: '{{ "{{" }} item.item.value | b64encode {{ "}}" }}'
              commit_message: 'Add Pipelines-as-Code definitions'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          loop: '{{ "{{" }} r_pac_file.results {{ "}}" }}'
          when: item.status == 404
          # Committed as root -- the project Owner, who can commit to the
          # protected default branch.

        - name: Update stale .tekton definitions
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/repository/files/{{ "{{" }} ('.tekton/' ~ item.item.key) | urlencode | regex_replace('/', '%2F') {{ "}}" }}
            method: PUT
            body_format: form-urlencoded
            body:
              branch: {{ $branch }}
              encoding: base64
              content: '{{ "{{" }} item.item.value | b64encode {{ "}}" }}'
              commit_message: 'Update Pipelines-as-Code definitions'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 200
          loop: '{{ "{{" }} r_pac_file.results {{ "}}" }}'
          when: >-
            item.status == 200
            and (item.json.content | b64decode) != item.item.value

        - name: Create the Pipelines-as-Code Repository CR for {{ $repo.name }}
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: pipelinesascode.tekton.dev/v1alpha1
              kind: Repository
              metadata:
                name: {{ $repo.name }}
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: tssc-validated-pattern
              spec:
                url: https://{{ $host }}/{{ $group.name }}/{{ $repo.name }}.git
                git_provider:
                  type: gitlab
                  url: https://{{ $host }}
                  secret:
                    name: gitlab-pac-token
                    key: token
                  webhook_secret:
                    name: gitlab-pac-webhook
                    key: webhook-secret
{{- end }}

{{- if and $repo.accessToken ($repo.accessToken.enabled | default false) $pipelineNs }}
{{- $tok := $repo.accessToken }}

        # ---- pipeline SCM credential ---------------------------------------
        # open-pr and open-cve-issues authenticate with `scm-auth-secret` (the
        # application repository's token) in the pipeline namespace;
        # gitops-cd-dev's gitops-bump-image uses the gitops repository's own
        # `scm-auth-gitops-secret`. Minting them here is what lets the demo
        # come up without anyone pasting a PAT; one project access token per
        # repository (not the root PAT) keeps the blast radius to a single
        # project each. They cannot be shared: a GitLab project-bot user is a
        # member of exactly its own project and GitLab refuses to add it to any
        # other ("project bots cannot be added to other groups / projects"),
        # which is why the gitops repository gets a second token rather than a
        # membership grant for the first bot.
        #
        # The token value is only ever returned once, at creation. So: if the
        # Secret already holds one, leave everything alone. Otherwise revoke any
        # stale token of the same name -- its value is unrecoverable and it
        # would just accumulate -- and issue a fresh one.
        - name: Look for an existing SCM secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: {{ $tok.secretName | default "scm-auth-secret" }}
            namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
          register: r_scm_secret

        - name: Decide whether an SCM token is needed
          set_fact:
            scm_token_needed: >-
              {{ "{{" }} not (r_scm_secret.resources | length > 0
                 and r_scm_secret.resources[0].data.token | default('') | length > 0
                 and (r_scm_secret.resources[0].data.token | b64decode) != 'REPLACE_ME') {{ "}}" }}

        - name: List project access tokens on {{ $repo.name }}
          when: scm_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_pats

        - name: Revoke stale {{ $tok.name }} tokens
          when: scm_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens/{{ "{{" }} item.id {{ "}}" }}
            method: DELETE
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 204
              - 404
          loop: >-
            {{ "{{" }} (r_pats.json | default([]))
               | selectattr('name', 'equalto', '{{ $tok.name }}')
               | selectattr('active', 'equalto', true) | list {{ "}}" }}

        - name: Create project access token {{ $tok.name }}
          when: scm_token_needed | bool
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} project_id {{ "}}" }}/access_tokens
            method: POST
            body_format: json
            body:
              name: {{ $tok.name }}
              scopes: {{ $tok.scopes | default (list "api" "write_repository") | toJson }}
              # GitLab 16+ requires an expiry and rejects anything more than a
              # year out, so expiresInDays stays just inside the cap.
              expires_at: '{{ "{{" }} "%Y-%m-%d" | strftime(ansible_date_time.epoch | int + {{ mul (int ($tok.expiresInDays | default 364)) 86400 }}) {{ "}}" }}'
              access_level: {{ $tok.accessLevel | default 40 }}
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
          retries: 10
          delay: 5
          register: r_pat
          until: r_pat.status == 201 or r_pat is skipped

        - name: Store the SCM credential for the pipelines
          when: scm_token_needed | bool
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ $tok.secretName | default "scm-auth-secret" }}
                namespace: '{{ "{{" }} pipeline_namespace {{ "}}" }}'
                labels:
                  app.kubernetes.io/part-of: maven-build-ci
              type: Opaque
              stringData:
                # glab and `git push https://<user>:<token>@...` both expect
                # oauth2 as the username for a GitLab token.
                username: oauth2
                token: '{{ "{{" }} r_pat.json.token {{ "}}" }}'
                # The cluster-resolved git-clone task expects a `password`
                # key (its kubernetes.io/basic-auth compatibility path reads
                # username + password); without it the clone step dies with
                # "Unknown basic-auth workspace format". The open-pr and
                # open-cve-issues tasks read `token` directly. Same value,
                # two keys, both consumers work.
                password: '{{ "{{" }} r_pat.json.token {{ "}}" }}'
{{- end }}
{{- end }}

{{- range $project := $group.project }}

        - name: Create project {{ $project.name }} in {{ $group.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects
            method: POST
            body_format: form-urlencoded
            body:
              name: {{ $project.name }}
              visibility: public
              issues_access_level: enabled
              auto_devops_enabled: false
              remove_source_branch_after_merge: false
              namespace_id: '{{ "{{" }} r_group.json.id {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 400
              - 409
          retries: 10
          delay: 5
          register: r_create_project_result
          until: r_create_project_result.status in [201, 400, 409]
          failed_when:
            - r_create_project_result.status == 400
            - "'has already been taken' not in (r_create_project_result.json | default({}) | string)"

        - name: Look up project {{ $project.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ $group.name }}%2F{{ $project.name }}
            method: GET
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code: 200
          register: r_create_project

{{- if $project.labels }}

        - name: Create labels in {{ $project.name }}
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/projects/{{ "{{" }} r_create_project.json.id {{ "}}" }}/labels
            method: POST
            body_format: form-urlencoded
            body:
              name: '{{ "{{" }} item.name {{ "}}" }}'
              color: '{{ "{{" }} item.color {{ "}}" }}'
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          retries: 10
          delay: 5
          register: r_create_label
          until: r_create_label.status in [201, 409]
          loop:
{{- range $label := $project.labels }}
            - name: {{ $label.name }}
              color: "{{ $label.color }}"
{{- end }}
{{- end }}
{{- end }}

{{- range $member := $group.users }}

        - name: Add user {{ $member.id }} to {{ $group.name }}
          when: item.username == '{{ $member.id }}'
          ansible.builtin.uri:
            url: https://{{ $host }}/api/v4/groups/{{ "{{" }} r_group.json.id {{ "}}" }}/members
            method: POST
            body_format: form-urlencoded
            body:
              user_id: '{{ "{{" }} item.id {{ "}}" }}'
              access_level: 50
            headers:
              PRIVATE-TOKEN: '{{ "{{" }} root_token {{ "}}" }}'
            validate_certs: false
            status_code:
              - 201
              - 409
          register: r_group_user
          retries: 10
          delay: 5
          until: r_group_user.status in [201, 409] or r_group_user is skipped
          loop: '{{ "{{" }} r_users.json {{ "}}" }}'
{{- end }}
{{- end }}
