{{- $host := include "gitlab.host" . }}
{{- $subdomain := required "Set cluster.subdomain" .Values.cluster.subdomain }}
{{- $quay := printf "quay.%s" $subdomain }}
{{- /* Application repo name -> its gitops repo routing. Derived from the
       gitops entries' rewriteImageRepository blocks (the single place the
       component<->gitops-repo<->chart-path mapping already lives), so the
       .tekton/ definitions can tell ci-build-publish WHERE to promote.
       Without these params every application's CI promotes into the FIRST
       application's gitops repo (gitops-cd-dev's defaults): on cluster-dl265
       a lightwell build wrote its tag into spring-boot's dev values. */}}
{{- $gitopsByComponent := dict }}
{{- range $group := .Values.gitlab.groups }}
{{- range $repo := $group.repo }}
{{- if and $repo.rewriteImageRepository ($repo.rewriteImageRepository.enabled | default false) }}
{{- $secret := "scm-auth-gitops-secret" }}
{{- if $repo.accessToken }}{{ $secret = $repo.accessToken.secretName | default "scm-auth-gitops-secret" }}{{ end }}
{{- $_ := set $gitopsByComponent $repo.rewriteImageRepository.component (dict "group" $group.name "repo" $repo.name "chartPath" (dir $repo.rewriteImageRepository.file) "secret" $secret) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (.Values.pac.enabled | default false) .Values.pipeline.namespace }}
# -----------------------------------------------------------------------------
# The .tekton/ PipelineRun definitions, as ConfigMap data keys, rendered
# PER APPLICATION REPOSITORY. Two key rules:
#
#   * A ConfigMap key cannot contain "/" (the API server rejects
#     ".tekton/push-ci.yaml" outright), so keys are base names only.
#   * Each key carries a "--<repo-name>" suffix: the seeding playbook
#     matches the suffix to commit each repository ONLY its own
#     definitions and strips the suffix when the file lands in .tekton/.
#     Without per-repo keys, every repo would run the first repo's
#     component config (a lightwell push built the spring-boot image
#     under the spring-boot component name).
#
# The per-repo values: component-name and output-image take the repository
# name, and git-auth binds the repository's OWN project-scoped SCM Secret
# (a GitLab project bot is a member of exactly one project).
# Pipelines-as-Code watches .tekton/ via the Repository CR the same Job
# creates, and matches runs to events by the annotations below.
#
# PaC template variables -- {{ "{{" }} repo_url {{ "}}" }}, {{ "{{" }} revision {{ "}}" }}, ... -- are
# escaped so Helm passes them through; the HOSTS are Helm-rendered here,
# because this ConfigMap is rendered once, per cluster, at seed time.
#
# The variables MUST sit inside a double-quoted YAML string: the committed
# file has to read value: "<double-quote><open-brace><open-brace> repo_url
# <close-brace><close-brace><double-quote>". A bare, unquoted variable
# parses as a YAML flow mapping, and PaC's unmarshal of the .tekton file
# dies with "invalid map key" -- one bad file aborts the whole event, so no
# PipelineRun from ANY .tekton file in the repo.
#
# Two runs per repository:
#   .tekton/push-ci.yaml               push to the default branch ->
#                                      ci-build-publish (build + image +
#                                      SBOM + dev promotion)
#   .tekton/generate-tests-comment.yaml /generate-tests-unit comment on an MR
#                                      -> agentic-test-generation-unit
#                                      (TECH PREVIEW: on-comment matching)
#
# There is deliberately NO MR-opened verification run: opening an MR runs
# nothing (merge-gating is off on the projects), so a remediation MR can be
# opened and merged without waiting for a verify pipeline. If you want MR
# verification back, re-add a pull_request-event definition -- and note the
# seeding job then also needs it listed here to keep it from being pruned
# (see the "Remove stale .tekton files" task in the playbook).
#
# The ISSUE-comment slash commands (/remediate, /generate-tests-* on
# issues) are NOT PaC-triggered -- PaC never matches issue comments. They
# go through the agentic-issue-commands EventListener
# (pipelines/triggers/), which the seeding job points a Note Hook webhook
# at. The CVE analysis pipeline itself is operator-invoked (tkn /
# orchestrator) -- see the RUNBOOK.
# -----------------------------------------------------------------------------
kind: ConfigMap
metadata:
  name:  cm-pac-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "2"
apiVersion: v1
data:
{{- range $group := .Values.gitlab.groups }}
{{- range $repo := $group.repo }}
{{- if (index $repo "pac" | default dict).enabled }}
{{- $scm := "scm-auth-secret" }}
{{- if $repo.accessToken }}{{ $scm = $repo.accessToken.secretName | default "scm-auth-secret" }}{{ end }}
{{- $branch := $repo.defaultBranch | default "main" }}
  # Keys carry a --<repo> suffix so the seeding job can commit each
  # repository ONLY its own definitions (the suffix is stripped when the
  # file lands in .tekton/). Without this, every repo runs the FIRST
  # repo's component config -- a lightwell push builds the spring-boot
  # image under the spring-boot component name.
  push-ci.yaml--{{ $repo.name }}: |
    ---
    # CI on merge to {{ $branch }}: build, publish the image to Quay, attach
    # + upload its SBOM to RHTPA, then promote the tag into the gitops
    # repo's dev values (the pipeline's finally task starts gitops-cd-dev).
    apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      # generateName, NOT name: with remote-tasks resolution disabled (see
      # the pipelines-defaults Job), PaC creates this PipelineRun verbatim,
      # and a fixed name collides on the second event ("pipelineruns.tekton.dev
      # ... already exists") -- the first run keeps the name forever.
      # generateName gives every event a unique run (ci-build-publish-xxxxx).
      generateName: ci-build-publish-
      annotations:
        pipelinesascode.tekton.dev/on-event: "[push]"
        pipelinesascode.tekton.dev/on-target-branch: "[{{ $branch }}]"
        pipelinesascode.tekton.dev/max-keep-runs: "3"
    spec:
      pipelineRef:
        name: ci-build-publish
      params:
        - name: component-name
          value: {{ $repo.name }}
        - name: git-url
          value: "{{ "{{" }} repo_url {{ "}}" }}"
        - name: revision
          value: "{{ "{{" }} revision {{ "}}" }}"
        - name: output-image
          value: "{{ $quay }}/tssc/{{ $repo.name }}:{{ "{{" }} revision {{ "}}" }}"
{{- $gi := index $gitopsByComponent $repo.name }}
{{- if $gi }}
        # Per-application promotion routing for the finally task's
        # gitops-cd-dev run: WHICH gitops repo, WHICH dev values file, and
        # WHICH gitops project-bot secret. Without them the run uses
        # gitops-cd-dev's spring-boot defaults and cross-promotes.
        - name: gitops-url
          value: "https://{{ $host }}/{{ $gi.group }}/{{ $gi.repo }}"
        - name: git-host
          value: {{ $host | quote }}
        - name: values-path
          value: "{{ $gi.chartPath }}/environments/dev/values.yaml"
        - name: scm-gitops-secret-name
          value: {{ $gi.secret | quote }}
{{- end }}
        # The first CI run on a fresh cluster is fired by the seeding
        # job's .tekton commit (wave 8) and can beat the wave-10 Quay
        # configuration to its image push; the run waits for the push
        # credential itself (wait-for-registry). Later runs find it
        # immediately -- and the wait task is skipped entirely when this
        # is "0".
        - name: registry-wait-timeout
          value: "30m"
        # ... and the same for RHTPA (wave 10): the first CI run must not
        # upload its SBOM against an RHTPA that is still starting. The
        # wait runs concurrently with the build, so it costs no time.
        - name: trustification-wait-timeout
          value: "30m"
      workspaces:
        - name: workspace
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi
        - name: maven-settings
          secret:
            secretName: maven-settings
        - name: git-auth
          secret:
            secretName: {{ $scm }}
  generate-tests-comment.yaml--{{ $repo.name }}: |
    ---
    # TECH PREVIEW (PaC on-comment matching): commenting /generate-tests-unit
    # on an open merge request generates unit tests for the MR's source
    # branch and opens the results as its own MR against the target branch.
    apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      # generateName for the same reason as push-ci.yaml above: every
      # matching comment needs its own uniquely-named run.
      generateName: generate-tests-unit-
      annotations:
        pipelinesascode.tekton.dev/on-event: "[pull_request_comment]"
        pipelinesascode.tekton.dev/on-target-branch: "[{{ $branch }}]"
        pipelinesascode.tekton.dev/on-comment: "^/generate-tests-unit"
    spec:
      pipelineRef:
        name: agentic-test-generation-unit
      params:
        - name: git-url
          value: "{{ "{{" }} repo_url {{ "}}" }}"
        - name: revision
          value: "{{ "{{" }} head_sha {{ "}}" }}"
        - name: base-branch
          value: "{{ "{{" }} target_branch {{ "}}" }}"
        - name: git-host
          value: {{ $host | quote }}
        - name: scm-provider
          value: gitlab
      workspaces:
        - name: workspace
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi
        - name: maven-settings
          secret:
            secretName: maven-settings
        - name: git-auth
          secret:
            secretName: {{ $scm }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
