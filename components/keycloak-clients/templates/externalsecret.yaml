{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
# -----------------------------------------------------------------------------
# The tpa-cli client secret this chart provisions into the cluster's existing
# Keycloak. Generated by the vault-secrets component; the SAME Vault entry
# backs oidc-tpa-cli (RHTPA) and tpa-secret (the pipelines), so the three
# cannot drift -- a mismatch shows up only as RHTPA 401s.
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tpaCliSecretName | default "tssc-tpa-cli-secret" }}
  namespace: {{ include "keycloak-clients.namespace" . }}
  labels:
    {{- include "keycloak-clients.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.tpaCliSecretName | default "tssc-tpa-cli-secret" }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ printf "%s/tpa-cli-client-secret" $prefix | quote }}
        property: client-secret
