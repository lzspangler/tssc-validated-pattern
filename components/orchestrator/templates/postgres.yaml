{{- $ns := .Values.namespace }}
# BYO PostgreSQL 15 for the platform backend + Temporal databases. The CR's
# migrations run as soon as it applies, so postgres must be answering first
# (earlier sync-wave, and the setup Job is not involved -- this is plain
# install ordering).
#
# ONE password feeds the postgres superuser env, the init SQL that CREATEs
# the orchestrator/temporal users, and both connection secrets -- all sourced
# from the SAME Vault entry (orchestrator-db-password) via the
# tssc-orchestrator-db Secret ESO materializes, so they cannot desync. The
# init SQL carries a __DB_PASSWORD__ placeholder that run-init.sh substitutes
# at runtime, because a ConfigMap cannot reference a Secret.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backend-pvc
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgres.storageClassName }}
  # Explicit rather than relying on the cluster's default storage class, so
  # the binding survives a change of default. Empty omits the field and uses
  # the default.
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
data:
  init.sql: |
    CREATE USER orchestrator WITH PASSWORD '__DB_PASSWORD__';
    CREATE USER temporal WITH PASSWORD '__DB_PASSWORD__';

    CREATE DATABASE orchestrator OWNER orchestrator;
    CREATE DATABASE temporal OWNER temporal;
    CREATE DATABASE temporal_visibility OWNER temporal;

    GRANT ALL PRIVILEGES ON DATABASE orchestrator TO orchestrator;
    GRANT ALL PRIVILEGES ON DATABASE temporal TO temporal;
    GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO temporal;

    -- Connect to the orchestrator database and install the required extension.
    \c orchestrator orchestrator
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
  run-init.sh: |
    #!/bin/bash
    echo "==> Executing initialization scripts..."

    # The password lives in the tssc-orchestrator-db Secret (Vault via ESO);
    # a ConfigMap cannot reference a Secret, so init.sql carries a
    # __DB_PASSWORD__ placeholder that is substituted here, at runtime.
    sed "s/__DB_PASSWORD__/${DB_PASSWORD//&/\\&}/g" /opt/app-root/src/postgresql-init/init.sql \
      | psql -v -d postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-backend
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: "orchestrator"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSecret | default "tssc-orchestrator-db" }}
                  key: password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSecret | default "tssc-orchestrator-db" }}
                  key: password
            - name: POSTGRESQL_DATABASE
              value: "orchestrator"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/pgsql/data
            - name: init-volume
              mountPath: /opt/app-root/src/postgresql-init
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-backend-pvc
        - name: init-volume
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-backend
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
