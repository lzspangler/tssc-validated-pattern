{{- $ns := .Values.namespace }}
{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
{{- $dbSecret := .Values.dbPasswordSecret | default "tssc-orchestrator-db" }}
# -----------------------------------------------------------------------------
# The database password Secret and both connection Secrets the CR's
# backendDatabase / temporalDatabase refs point at. Same names and keys as
# the plain Secrets they replace; the password comes from the same Vault
# entry (orchestrator-db-password) the postgres env and init SQL read, so
# the three cannot drift.
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $dbSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $dbSecret }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/orchestrator-db-password" $prefix | quote }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-postgres-backend
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: orchestrator-postgres-backend
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        host: {{ printf "postgres-backend.%s.svc.cluster.local" $ns | quote }}
        port: "5432"
        database: "orchestrator"
        username: "orchestrator"
        sslmode: "disable"
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/orchestrator-db-password" $prefix | quote }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-postgres-temporal
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.postgres | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: orchestrator-postgres-temporal
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        host: {{ printf "postgres-backend.%s.svc.cluster.local" $ns | quote }}
        port: "5432"
        database: "temporal"
        username: "temporal"
        sslmode: "disable"
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/orchestrator-db-password" $prefix | quote }}
        property: password
