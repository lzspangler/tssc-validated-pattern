{{- $name := include "quay-registry.name" . }}
{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
# -----------------------------------------------------------------------------
# The Quay superuser password, materialized from Vault. The seeding job
# reads it at runtime (see cm-config.yaml) -- /api/v1/user/initialize works
# exactly once, while the user table is empty, so the Vault entry must exist
# before the first run (vault-secrets runs at wave 1, quay at 10).
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.quay.adminPasswordSecret | default "tssc-quay-admin" }}
  labels:
    {{- include "quay-registry.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.config | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.quay.adminPasswordSecret | default "tssc-quay-admin" }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/quay-admin-password" $prefix | quote }}
        property: password
