---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: {{ .Values.operator.channel }}
  name: {{ .Values.operator.name }}
  source: {{ .Values.operator.source }}
  sourceNamespace: openshift-marketplace
  # Manual + the InstallPlan approver Job below: an Automated subscription
  # works too, but Manual keeps the approval visible as a Job the Argo
  # Application's health can wait on (the x2a-fsc pattern).
  installPlanApproval: Manual
