---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: {{ .Values.operator.channel }}
  name: {{ .Values.operator.name }}
  source: {{ .Values.operator.source }}
  sourceNamespace: openshift-marketplace
  # Automatic, like every other operator Subscription in this repo. A
  # Manual subscription CANNOT be combined with a wave-later approver Job:
  # Argo admits the approver's sync-wave only after this Subscription is
  # Healthy, and the Subscription is Healthy only after its InstallPlan is
  # approved -- by that approver. That exact cycle stalled a fresh install
  # (cluster-hnjcl: sync operation "waiting for healthy state of
  # Subscription" forever, every ExternalSecret in the cluster
  # un-syncable, artifactory/gitlab/quay cascading OutOfSync). See the
  # orchestrator component for the same conclusion reached earlier.
  installPlanApproval: Automatic
