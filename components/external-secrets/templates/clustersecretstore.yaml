# -----------------------------------------------------------------------------
# The cluster-wide Vault SecretStore. Every component-rendered ExternalSecret
# references it by name (vault.secretStoreName) and pulls keys from
# <kvMount>/<pathPrefix>/<name>.
#
# Wave 1: after the operator (wave 0 CRDs) so the CRD exists, before every
# consumer (waves 5+). SkipDryRunOnMissingResource covers the first-sync race.
# -----------------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.vault.secretStoreName }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      # KV v2 mount name.
      path: {{ .Values.vault.kvMount | quote }}
      version: v2
      auth:
        # Static token from the platform-provided Secret in the Vault
        # namespace. A ClusterSecretStore may reference a Secret in any
        # namespace. Swap for kubernetes auth if the platform Vault is
        # configured for it.
        tokenSecretRef:
          name: {{ .Values.vault.tokenSecretName | quote }}
          key: {{ .Values.vault.tokenSecretKey | quote }}
          namespace: {{ .Values.vault.namespace | quote }}
