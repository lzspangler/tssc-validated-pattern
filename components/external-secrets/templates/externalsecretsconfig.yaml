# -----------------------------------------------------------------------------
# The on-switch for the OCP external-secrets operator. The operator itself is
# installed by the Subscription, but it deploys (and runs) the actual ESO
# controller ONLY when this cluster-scoped ExternalSecretsConfig CR exists --
# without it the operator logs "externalsecretsconfigs.operator.openshift.io
# object not found, skipping reconciliation" forever and no Secret ever
# materializes (that is the x2a-fsc externalsecretsconfig.yaml this file
# replicates; the empty spec is deliberate).
#
# SkipDryRunOnMissingResource covers the first-sync race with the operator's
# own CRD; wave -1 lands it as early in this Application as possible.
# -----------------------------------------------------------------------------
---
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: {}
